<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Website Dashboard</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:#f4f7fb;

    color:#172033;

    overflow-x:hidden;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container{

    width:100%;

    max-width:1400px;

    margin:0 auto;

    padding:18px;

}


/* =====================================================
   TOP HEADER
===================================================== */

.top-header{

    width:100%;

    background:#ffffff;

    border:1px solid #e5eaf1;

    border-radius:16px;

    padding:16px 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    box-shadow:
        0 5px 20px rgba(15,23,42,.05);

    margin-bottom:15px;

}

.header-left{

    min-width:0;

}

.header-title{

    font-size:22px;

    font-weight:700;

    color:#172033;

    display:flex;

    align-items:center;

    gap:10px;

}

.header-title i{

    color:#16a34a;

}

.header-subtitle{

    margin-top:4px;

    font-size:13px;

    color:#718096;

}

.refresh-btn{

    border:0;

    background:#16a34a;

    color:#fff;

    min-width:42px;

    height:42px;

    padding:0 14px;

    border-radius:10px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    font-size:14px;

    font-weight:600;

    transition:.2s;

}

.refresh-btn:hover{

    background:#15803d;

}

.refresh-btn.loading i{

    animation:spin .8s linear infinite;

}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   SUMMARY CARDS
===================================================== */

.summary-grid{

    display:grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap:12px;

    margin-bottom:15px;

}

.summary-card{

    background:#ffffff;

    border:1px solid #e5eaf1;

    border-radius:14px;

    padding:14px;

    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;

    box-shadow:
        0 4px 16px rgba(15,23,42,.04);

}

.summary-icon{

    width:42px;

    height:42px;

    flex:0 0 42px;

    border-radius:11px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:17px;

}

.total-card .summary-icon{

    background:#e8f1ff;

    color:#2563eb;

}

.active-card .summary-icon{

    background:#e8f8ee;

    color:#16a34a;

}

.inactive-card .summary-icon{

    background:#fff0f0;

    color:#dc2626;

}

.summary-info{

    min-width:0;

}

.summary-label{

    font-size:12px;

    color:#718096;

    font-weight:600;

}

.summary-number{

    margin-top:2px;

    font-size:22px;

    line-height:1.1;

    font-weight:800;

    color:#172033;

}


/* =====================================================
   FILTER + SEARCH
===================================================== */

.toolbar{

    background:#ffffff;

    border:1px solid #e5eaf1;

    border-radius:14px;

    padding:12px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-bottom:15px;

    box-shadow:
        0 4px 16px rgba(15,23,42,.04);

}

.filters{

    display:flex;

    align-items:center;

    gap:7px;

    flex-wrap:wrap;

}

.filter-btn{

    border:1px solid #dbe2ea;

    background:#ffffff;

    color:#475569;

    padding:8px 13px;

    border-radius:9px;

    font-size:13px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;

}

.filter-btn:hover{

    background:#f8fafc;

}

.filter-btn.active{

    background:#172033;

    border-color:#172033;

    color:#ffffff;

}

.search-box{

    position:relative;

    width:250px;

    max-width:100%;

}

.search-box i{

    position:absolute;

    left:12px;

    top:50%;

    transform:translateY(-50%);

    color:#94a3b8;

    font-size:13px;

}

.search-box input{

    width:100%;

    height:38px;

    border:1px solid #dbe2ea;

    border-radius:9px;

    outline:none;

    padding:0 12px 0 35px;

    font-size:13px;

    color:#172033;

    background:#fff;

}

.search-box input:focus{

    border-color:#16a34a;

    box-shadow:
        0 0 0 3px rgba(22,163,74,.08);

}


/* =====================================================
   WEBSITE GRID
===================================================== */

.website-grid{

    display:grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap:14px;

}


/* =====================================================
   WEBSITE CARD
===================================================== */

.website-card{

    position:relative;

    background:#ffffff;

    border:1px solid #e5eaf1;

    border-radius:14px;

    padding:15px;

    min-width:0;

    box-shadow:
        0 4px 18px rgba(15,23,42,.045);

    transition:
        transform .2s,
        box-shadow .2s;

}

.website-card:hover{

    transform:translateY(-2px);

    box-shadow:
        0 8px 25px rgba(15,23,42,.08);

}

.website-card.inactive{

    opacity:.78;

    background:#fafafa;

}


/* =====================================================
   CARD TOP
===================================================== */

.card-top{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;

}

.website-logo{

    width:48px;

    height:48px;

    flex:0 0 48px;

    border-radius:12px;

    background:#f1f5f9;

    border:1px solid #e2e8f0;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}

.website-logo img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.website-logo i{

    font-size:19px;

    color:#64748b;

}


/* =====================================================
   STATUS
===================================================== */

.status-badge{

    display:inline-flex;

    align-items:center;

    gap:5px;

    padding:5px 8px;

    border-radius:999px;

    font-size:10px;

    font-weight:700;

    white-space:nowrap;

}

.status-badge::before{

    content:"";

    width:6px;

    height:6px;

    border-radius:50%;

}

.status-active{

    background:#eaf8ef;

    color:#15803d;

}

.status-active::before{

    background:#16a34a;

}

.status-inactive{

    background:#feecec;

    color:#dc2626;

}

.status-inactive::before{

    background:#dc2626;

}


/* =====================================================
   CARD CONTENT
===================================================== */

.website-name{

    font-size:16px;

    font-weight:700;

    color:#172033;

    margin-bottom:6px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}

.website-description{

    font-size:12px;

    color:#718096;

    line-height:1.5;

    min-height:36px;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;

}

.website-meta{

    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-top:10px;

}

.meta-item{

    font-size:10px;

    color:#64748b;

    background:#f8fafc;

    border:1px solid #edf1f5;

    border-radius:7px;

    padding:4px 7px;

}


/* =====================================================
   OPEN BUTTON
===================================================== */

.open-btn{

    width:100%;

    margin-top:13px;

    height:36px;

    border:0;

    border-radius:9px;

    background:#16a34a;

    color:#ffffff;

    font-size:12px;

    font-weight:700;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    transition:.2s;

}

.open-btn:hover{

    background:#15803d;

}

.website-card.inactive .open-btn{

    background:#94a3b8;

    cursor:not-allowed;

}


/* =====================================================
   EMPTY
===================================================== */

.empty-state{

    grid-column:1 / -1;

    background:#ffffff;

    border:1px dashed #cbd5e1;

    border-radius:14px;

    padding:45px 20px;

    text-align:center;

    color:#64748b;

}

.empty-state i{

    font-size:35px;

    margin-bottom:12px;

    color:#94a3b8;

}

.empty-state h3{

    font-size:16px;

    color:#334155;

    margin-bottom:5px;

}

.empty-state p{

    font-size:12px;

}


/* =====================================================
   LOADING
===================================================== */

.loading-state{

    grid-column:1 / -1;

    padding:50px 20px;

    text-align:center;

    color:#64748b;

}

.loading-state i{

    font-size:28px;

    margin-bottom:10px;

}

.loading-state p{

    font-size:13px;

}


/* =====================================================
   ERROR
===================================================== */

.error-state{

    grid-column:1 / -1;

    background:#fff;

    border:1px solid #fecaca;

    color:#b91c1c;

    border-radius:14px;

    padding:25px;

    text-align:center;

}

.error-state i{

    font-size:28px;

    margin-bottom:10px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1100px){

    .website-grid{

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

    }

}

@media(max-width:800px){

    .website-grid{

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

    }

    .toolbar{

        align-items:stretch;

        flex-direction:column;

    }

    .search-box{

        width:100%;

    }

}

@media(max-width:600px){

    .container{

        padding:10px;

    }

    .top-header{

        padding:12px;

        border-radius:12px;

    }

    .header-title{

        font-size:17px;

    }

    .header-subtitle{

        font-size:11px;

    }

    .refresh-btn{

        width:38px;

        min-width:38px;

        height:38px;

        padding:0;

    }

    .refresh-btn span{

        display:none;

    }


    /* SMALL SUMMARY CARDS */

    .summary-grid{

        grid-template-columns:
            repeat(3, minmax(0,1fr));

        gap:7px;

    }

    .summary-card{

        padding:9px 6px;

        border-radius:10px;

        flex-direction:column;

        justify-content:center;

        text-align:center;

        gap:5px;

    }

    .summary-icon{

        width:30px;

        height:30px;

        flex-basis:30px;

        border-radius:8px;

        font-size:12px;

    }

    .summary-label{

        font-size:9px;

    }

    .summary-number{

        font-size:18px;

    }


    /* FILTER */

    .toolbar{

        padding:9px;

        gap:9px;

    }

    .filters{

        width:100%;

        display:grid;

        grid-template-columns:
            repeat(3,1fr);

        gap:5px;

    }

    .filter-btn{

        padding:7px 4px;

        font-size:10px;

        text-align:center;

    }


    /* WEBSITE */

    .website-grid{

        grid-template-columns:
            repeat(2, minmax(0,1fr));

        gap:8px;

    }

    .website-card{

        padding:10px;

        border-radius:11px;

    }

    .website-logo{

        width:38px;

        height:38px;

        flex-basis:38px;

        border-radius:9px;

    }

    .website-logo i{

        font-size:15px;

    }

    .status-badge{

        font-size:8px;

        padding:4px 6px;

    }

    .website-name{

        font-size:13px;

        margin-bottom:4px;

    }

    .website-description{

        font-size:10px;

        min-height:30px;

    }

    .meta-item{

        font-size:8px;

        padding:3px 5px;

    }

    .open-btn{

        height:32px;

        margin-top:9px;

        font-size:10px;

    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:360px){

    .website-grid{

        grid-template-columns:1fr;

    }

    .summary-number{

        font-size:17px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="top-header">

        <div class="header-left">

            <div class="header-title">

                <i class="fa-solid fa-globe"></i>

                Websites

            </div>

            <div class="header-subtitle">

                Manage and access available websites

            </div>

        </div>


        <button
            class="refresh-btn"
            id="refreshBtn"
            onclick="loadWebsites()"
        >

            <i class="fa-solid fa-rotate-right"></i>

            <span>Refresh</span>

        </button>

    </div>


    <!-- =================================================
         SUMMARY
    ================================================= -->

    <div class="summary-grid">


        <div class="summary-card total-card">

            <div class="summary-icon">

                <i class="fa-solid fa-layer-group"></i>

            </div>

            <div class="summary-info">

                <div class="summary-label">
                    Total
                </div>

                <div
                    class="summary-number"
                    id="totalCount"
                >
                    0
                </div>

            </div>

        </div>


        <div class="summary-card active-card">

            <div class="summary-icon">

                <i class="fa-solid fa-circle-check"></i>

            </div>

            <div class="summary-info">

                <div class="summary-label">
                    Active
                </div>

                <div
                    class="summary-number"
                    id="activeCount"
                >
                    0
                </div>

            </div>

        </div>


        <div class="summary-card inactive-card">

            <div class="summary-icon">

                <i class="fa-solid fa-circle-xmark"></i>

            </div>

            <div class="summary-info">

                <div class="summary-label">
                    Inactive
                </div>

                <div
                    class="summary-number"
                    id="inactiveCount"
                >
                    0
                </div>

            </div>

        </div>


    </div>


    <!-- =================================================
         TOOLBAR
    ================================================= -->

    <div class="toolbar">


        <div class="filters">

            <button
                class="filter-btn active"
                data-filter="all"
                onclick="setFilter('all', this)"
            >
                All
            </button>


            <button
                class="filter-btn"
                data-filter="active"
                onclick="setFilter('active', this)"
            >
                Active
            </button>


            <button
                class="filter-btn"
                data-filter="inactive"
                onclick="setFilter('inactive', this)"
            >
                Inactive
            </button>

        </div>


        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search website..."
                autocomplete="off"
            >

        </div>


    </div>


    <!-- =================================================
         WEBSITE GRID
    ================================================= -->

    <div
        class="website-grid"
        id="websiteGrid"
    >

        <div class="loading-state">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <p>
                Loading websites...
            </p>

        </div>

    </div>


</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";


/* =====================================================
   VARIABLES
===================================================== */

let websites = [];

let currentFilter = "all";


/* =====================================================
   DOM
===================================================== */

const websiteGrid =
    document.getElementById(
        "websiteGrid"
    );

const totalCount =
    document.getElementById(
        "totalCount"
    );

const activeCount =
    document.getElementById(
        "activeCount"
    );

const inactiveCount =
    document.getElementById(
        "inactiveCount"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


/* =====================================================
   LOAD WEBSITES
===================================================== */

async function loadWebsites(){

    refreshBtn.classList.add(
        "loading"
    );

    websiteGrid.innerHTML = `

        <div class="loading-state">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <p>
                Loading websites...
            </p>

        </div>

    `;

    try{

        const url =
            API_URL +
            "?action=getCards&_=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to load websites."
            );

        }


        websites =
            Array.isArray(data.cards)
                ? data.cards
                : [];


        updateSummary();

        renderWebsites();


    }catch(error){

        console.error(
            "Website API Error:",
            error
        );


        websiteGrid.innerHTML = `

            <div class="error-state">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <h3>
                    Failed to load websites
                </h3>

                <p>
                    ${escapeHTML(
                        error.message ||
                        "Unknown error"
                    )}
                </p>

            </div>

        `;

    }finally{

        refreshBtn.classList.remove(
            "loading"
        );

    }

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    const total =
        websites.length;


    const active =
        websites.filter(
            function(site){

                return getStatus(site)
                    === "active";

            }
        ).length;


    const inactive =
        websites.filter(
            function(site){

                return getStatus(site)
                    === "inactive";

            }
        ).length;


    totalCount.textContent =
        total;


    activeCount.textContent =
        active;


    inactiveCount.textContent =
        inactive;

}


/* =====================================================
   GET STATUS
===================================================== */

function getStatus(site){

    const status =
        String(
            site.status ||
            "Active"
        )
        .trim()
        .toLowerCase();


    if(
        status === "inactive" ||
        status === "off" ||
        status === "disabled"
    ){

        return "inactive";

    }


    return "active";

}


/* =====================================================
   FILTER
===================================================== */

function setFilter(
    filter,
    button
){

    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            function(btn){

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    renderWebsites();

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        renderWebsites();

    }
);


/* =====================================================
   RENDER
===================================================== */

function renderWebsites(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    let filtered =
        websites.filter(
            function(site){

                const status =
                    getStatus(site);


                /* FILTER */

                if(
                    currentFilter ===
                    "active" &&
                    status !== "active"
                ){

                    return false;

                }


                if(
                    currentFilter ===
                    "inactive" &&
                    status !== "inactive"
                ){

                    return false;

                }


                /* SEARCH */

                if(search){

                    const text = (

                        site.name ||
                        ""

                    ) + " " + (

                        site.description ||
                        ""

                    ) + " " + (

                        site.type ||
                        ""

                    ) + " " + (

                        site.source ||
                        ""

                    ) + " " + (

                        site.link ||
                        ""

                    );


                    if(
                        !text
                            .toLowerCase()
                            .includes(search)
                    ){

                        return false;

                    }

                }


                return true;

            }
        );


    filtered.sort(
        function(a,b){

            return (
                Number(
                    a.position || 0
                )
                -
                Number(
                    b.position || 0
                )
            );

        }
    );


    if(
        filtered.length === 0
    ){

        websiteGrid.innerHTML = `

            <div class="empty-state">

                <i class="fa-solid fa-folder-open"></i>

                <h3>
                    No websites found
                </h3>

                <p>
                    No website matches the selected filter.
                </p>

            </div>

        `;

        return;

    }


    websiteGrid.innerHTML =
        filtered
            .map(
                createWebsiteCard
            )
            .join("");

}


/* =====================================================
   CREATE CARD
===================================================== */

function createWebsiteCard(
    site
){

    const status =
        getStatus(site);


    const inactive =
        status === "inactive";


    const statusText =
        inactive
            ? "Inactive"
            : "Active";


    const logo =
        String(
            site.logo || ""
        ).trim();


    const logoHTML =
        logo

            ? `

                <img
                    src="${escapeAttribute(logo)}"
                    alt=""
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <i
                    class="fa-solid fa-globe"
                    style="display:none"
                ></i>

            `

            : `

                <i
                    class="fa-solid fa-globe"
                ></i>

            `;


    const description =
        site.description ||
        "Website access";


    const type =
        site.type ||
        "Website";


    const source =
        site.source ||
        "Unknown";


    return `

        <div
            class="website-card
            ${inactive ? "inactive" : ""}"
        >


            <div class="card-top">


                <div class="website-logo">

                    ${logoHTML}

                </div>


                <span
                    class="
                        status-badge
                        ${
                            inactive
                                ? "status-inactive"
                                : "status-active"
                        }
                    "
                >

                    ${statusText}

                </span>


            </div>


            <div class="website-name">

                ${escapeHTML(
                    site.name ||
                    "Unnamed Website"
                )}

            </div>


            <div class="website-description">

                ${escapeHTML(
                    description
                )}

            </div>


            <div class="website-meta">

                <span class="meta-item">

                    <i class="fa-solid fa-tag"></i>

                    ${escapeHTML(type)}

                </span>


                <span class="meta-item">

                    <i class="fa-solid fa-server"></i>

                    ${escapeHTML(source)}

                </span>

            </div>


            <button
                class="open-btn"
                ${
                    inactive
                        ? "disabled"
                        : ""
                }
                onclick="
                    openWebsite(
                        '${escapeAttribute(site.link || "")}',
                        ${inactive}
                    )
                "
            >

                <i
                    class="
                        fa-solid
                        ${
                            inactive
                                ? "fa-lock"
                                : "fa-arrow-up-right-from-square"
                        }
                    "
                ></i>

                ${
                    inactive
                        ? "Inactive"
                        : "Open Website"
                }

            </button>


        </div>

    `;

}


/* =====================================================
   OPEN WEBSITE
===================================================== */

function openWebsite(
    link,
    inactive
){

    if(inactive){

        return;

    }


    if(!link){

        alert(
            "Website link is not available."
        );

        return;

    }


    window.open(
        link,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        "&quot;"
    );

}


/* =====================================================
   START
===================================================== */

loadWebsites();

</script>

</body>
</html>
