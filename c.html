<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Website Control Dashboard</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Inter",sans-serif;
    background:
        radial-gradient(
            circle at top left,
            #172033 0%,
            #0b1019 42%,
            #06090e 100%
        );
    color:#f8fafc;
    min-height:100vh;
    overflow-x:hidden;
}


/* =========================================================
   LOGIN
========================================================= */

#loginScreen{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.login-box{
    width:100%;
    max-width:390px;
    background:rgba(15,23,42,.94);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
    backdrop-filter:blur(18px);
}

.login-icon{
    width:64px;
    height:64px;
    border-radius:18px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:#fff;
    box-shadow:0 12px 30px rgba(34,197,94,.20);
}

.login-box h1{
    text-align:center;
    font-size:23px;
    font-weight:800;
}

.login-box p{
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    margin-top:7px;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:#cbd5e1;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

.input-wrap i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#64748b;
}

.input-wrap input{
    width:100%;
    height:50px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
    background:#080e17;
    color:#fff;
    outline:none;
    padding:0 14px 0 42px;
    font-size:14px;
}

.input-wrap input:focus{
    border-color:#22c55e;
    box-shadow:0 0 0 3px rgba(34,197,94,.08);
}

.login-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.login-btn:active{
    transform:scale(.98);
}

.login-btn:disabled{
    opacity:.6;
}

.login-error{
    display:none;
    margin-top:13px;
    padding:11px;
    border-radius:10px;
    background:rgba(239,68,68,.10);
    border:1px solid rgba(239,68,68,.20);
    color:#fca5a5;
    font-size:12px;
    text-align:center;
}


/* =========================================================
   DASHBOARD
========================================================= */

#dashboard{
    display:none;
    min-height:100vh;
    min-height:100dvh;
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{
    height:68px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:rgba(7,10,16,.88);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(18px);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:39px;
    height:39px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    font-size:16px;
}

.brand-text h2{
    font-size:15px;
    font-weight:800;
}

.brand-text span{
    display:block;
    font-size:10px;
    color:#64748b;
    margin-top:2px;
}

.user-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-info{
    text-align:right;
}

.user-name{
    font-size:12px;
    font-weight:700;
}

.user-label{
    font-size:9px;
    color:#64748b;
    margin-top:2px;
}

.logout-btn{
    width:38px;
    height:38px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.08);
    background:#111827;
    color:#f87171;
    cursor:pointer;
}

.logout-btn:active{
    transform:scale(.94);
}


/* =========================================================
   CONTENT
========================================================= */

.container{
    width:100%;
    max-width:1450px;
    margin:auto;
    padding:27px;
}

.page-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.page-title h1{
    font-size:26px;
    font-weight:800;
    letter-spacing:-.5px;
}

.page-title p{
    color:#64748b;
    font-size:12px;
    margin-top:5px;
}

.add-btn{
    height:42px;
    padding:0 16px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:#fff;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
}

.add-btn:active{
    transform:scale(.96);
}


/* =========================================================
   SEARCH
========================================================= */

.toolbar{
    width:100%;
    display:flex;
    justify-content:flex-end;
    margin-bottom:18px;
}

.search-box{
    width:310px;
    position:relative;
}

.search-box i{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:#64748b;
    font-size:12px;
}

.search-box input{
    width:100%;
    height:42px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(15,23,42,.80);
    color:#fff;
    outline:none;
    padding:0 13px 0 38px;
    font-size:12px;
}

.search-box input:focus{
    border-color:#22c55e;
}


/* =========================================================
   CARDS
========================================================= */

.cards{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(225px,1fr)
        );
    gap:14px;
}

.card{
    min-width:0;
    padding:15px;
    border-radius:16px;
    background:
        linear-gradient(
            145deg,
            rgba(20,29,46,.96),
            rgba(9,14,23,.96)
        );
    border:1px solid rgba(255,255,255,.07);
    transition:.2s ease;
}

.card:hover{
    transform:translateY(-3px);
    border-color:rgba(34,197,94,.25);
    box-shadow:0 16px 32px rgba(0,0,0,.25);
}

.card-top{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.logo{
    width:45px;
    height:45px;
    min-width:45px;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111827;
    border:1px solid rgba(255,255,255,.07);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.logo-fallback{
    font-size:17px;
    font-weight:800;
    color:#22c55e;
}

.card-title{
    min-width:0;
    flex:1;
}

.card-title h3{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-title span{
    display:inline-flex;
    margin-top:4px;
    font-size:8px;
    padding:4px 6px;
    border-radius:5px;
    background:rgba(34,197,94,.10);
    color:#4ade80;
}

.card-description{
    color:#94a3b8;
    font-size:10px;
    line-height:1.5;
    margin-top:11px;
    min-height:30px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.meta{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin-top:9px;
}

.meta span{
    font-size:8px;
    color:#94a3b8;
    background:#111827;
    border:1px solid rgba(255,255,255,.05);
    padding:4px 6px;
    border-radius:5px;
    white-space:nowrap;
}

.card-bottom{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.open-btn{
    flex:1;
    min-width:0;
    height:34px;
    border-radius:8px;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:10px;
    font-weight:700;
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.18);
    color:#4ade80;
}

.open-btn:active{
    transform:scale(.97);
}

.edit-btn{
    width:36px;
    min-width:36px;
    height:34px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.07);
    background:#111827;
    color:#cbd5e1;
    cursor:pointer;
}

.edit-btn:active{
    transform:scale(.94);
}


/* =========================================================
   LOADING / EMPTY
========================================================= */

.loading{
    text-align:center;
    padding:55px 20px;
    color:#64748b;
    font-size:12px;
}

.loading i{
    font-size:22px;
}

.empty{
    display:none;
    text-align:center;
    padding:60px 20px;
    color:#64748b;
    font-size:12px;
}

.empty i{
    font-size:35px;
    margin-bottom:12px;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:570px;
    max-height:calc(100vh - 30px);
    max-height:calc(100dvh - 30px);
    overflow-y:auto;
    background:#0f172a;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:21px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.modal-head h2{
    font-size:18px;
}

.close-btn{
    width:34px;
    height:34px;
    border:none;
    border-radius:8px;
    background:#111827;
    color:#94a3b8;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:10px;
    font-weight:600;
    color:#cbd5e1;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid rgba(255,255,255,.08);
    background:#080d16;
    color:#fff;
    border-radius:8px;
    outline:none;
    padding:10px;
    font-family:inherit;
    font-size:11px;
}

.form-group input{
    height:39px;
}

.form-group textarea{
    min-height:70px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#22c55e;
}

.modal-actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:20px;
}

.left-actions,
.right-actions{
    display:flex;
    gap:7px;
}

.btn{
    height:37px;
    padding:0 14px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
    font-size:10px;
    font-weight:700;
}

.cancel-btn{
    background:#111827;
    color:#cbd5e1;
}

.save-btn{
    background:#22c55e;
    color:#fff;
    border-color:#22c55e;
}

.delete-btn{
    background:rgba(239,68,68,.10);
    color:#f87171;
    border-color:rgba(239,68,68,.20);
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:1000;
    width:max-content;
    max-width:calc(100% - 30px);
    padding:11px 15px;
    border-radius:9px;
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
    font-size:11px;
    display:none;
    text-align:center;
}

.toast.show{
    display:block;
}

.toast.success{
    border-color:rgba(34,197,94,.25);
    color:#4ade80;
}

.toast.error{
    border-color:rgba(239,68,68,.25);
    color:#f87171;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:900px){

    .container{
        padding:22px;
    }

    .cards{
        grid-template-columns:
            repeat(
                3,
                minmax(0,1fr)
            );
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    body{
        padding-bottom:10px;
    }

    .topbar{
        height:62px;
        padding:0 13px;
    }

    .brand{
        gap:8px;
    }

    .brand-logo{
        width:36px;
        height:36px;
        border-radius:10px;
        font-size:14px;
    }

    .brand-text h2{
        font-size:13px;
    }

    .brand-text span{
        display:none;
    }

    .user-area{
        gap:7px;
    }

    .user-info{
        display:none;
    }

    .logout-btn{
        width:36px;
        height:36px;
    }

    .container{
        padding:17px 12px 25px;
    }

    .page-head{
        align-items:center;
        margin-bottom:15px;
    }

    .page-title h1{
        font-size:20px;
    }

    .page-title p{
        font-size:10px;
        margin-top:3px;
    }

    .add-btn{
        width:40px;
        height:40px;
        padding:0;
        justify-content:center;
        border-radius:10px;
    }

    .add-btn span{
        display:none;
    }

    .add-btn i{
        font-size:13px;
    }

    .toolbar{
        margin-bottom:13px;
    }

    .search-box{
        width:100%;
    }

    .search-box input{
        height:40px;
        font-size:11px;
    }

    .cards{
        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
        gap:9px;
    }

    .card{
        padding:11px;
        border-radius:13px;
    }

    .card:hover{
        transform:none;
    }

    .card-top{
        gap:8px;
    }

    .logo{
        width:38px;
        height:38px;
        min-width:38px;
        border-radius:9px;
    }

    .logo-fallback{
        font-size:14px;
    }

    .card-title h3{
        font-size:11px;
    }

    .card-title span{
        font-size:7px;
        padding:3px 5px;
        margin-top:3px;
    }

    .card-description{
        font-size:9px;
        margin-top:8px;
        min-height:27px;
    }

    .meta{
        margin-top:7px;
        gap:4px;
    }

    .meta span{
        font-size:7px;
        padding:3px 5px;
    }

    .card-bottom{
        margin-top:9px;
        gap:5px;
    }

    .open-btn{
        height:31px;
        font-size:8px;
    }

    .edit-btn{
        width:32px;
        min-width:32px;
        height:31px;
        font-size:9px;
    }

    .modal{
        padding:8px;
        align-items:flex-end;
    }

    .modal-box{
        max-height:
            calc(100dvh - 16px);
        border-radius:17px 17px 0 0;
        padding:18px 15px;
    }

    .modal-head{
        margin-bottom:15px;
    }

    .modal-head h2{
        font-size:16px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:10px;
    }

    .form-group.full{
        grid-column:auto;
    }

    .form-group input{
        height:42px;
    }

    .form-group textarea{
        min-height:75px;
    }

    .modal-actions{
        flex-direction:column;
        align-items:stretch;
    }

    .left-actions,
    .right-actions{
        width:100%;
    }

    .right-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .left-actions .btn{
        width:100%;
    }

    .btn{
        height:40px;
    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:370px){

    .container{
        padding-left:9px;
        padding-right:9px;
    }

    .cards{
        gap:7px;
    }

    .card{
        padding:9px;
    }

    .logo{
        width:34px;
        height:34px;
        min-width:34px;
    }

    .card-title h3{
        font-size:10px;
    }

    .card-description{
        font-size:8px;
    }

    .meta span{
        font-size:6.5px;
    }

    .open-btn{
        font-size:7.5px;
    }

}


/* =========================================================
   ONE COLUMN MOBILE OPTION
========================================================= */

@media(max-width:300px){

    .cards{
        grid-template-columns:1fr;
    }

}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(padding:max(0px)){

    .container{
        padding-bottom:
            max(
                25px,
                env(safe-area-inset-bottom)
            );
    }

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:5px;
    height:5px;
}

::-webkit-scrollbar-track{
    background:#080d16;
}

::-webkit-scrollbar-thumb{
    background:#263244;
    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:#334155;
}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

    <div class="login-box">

        <div class="login-icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>
            Control Dashboard
        </h1>

        <p>
            Enter your username to continue
        </p>

        <div class="input-group">

            <label>
                Username
            </label>

            <div class="input-wrap">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="usernameInput"
                    placeholder="Enter username"
                    autocomplete="username"
                >

            </div>

        </div>

        <button
            type="button"
            class="login-btn"
            id="loginBtn"
            onclick="login()"
        >

            <i class="fa-solid fa-right-to-bracket"></i>

            &nbsp;

            Login

        </button>

        <div
            class="login-error"
            id="loginError"
        ></div>

    </div>

</section>



<!-- =====================================================
     DASHBOARD
===================================================== -->

<section id="dashboard">


    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">

                <i class="fa-solid fa-layer-group"></i>

            </div>

            <div class="brand-text">

                <h2>
                    Website Control
                </h2>

                <span>
                    Management Dashboard
                </span>

            </div>

        </div>


        <div class="user-area">

            <div class="user-info">

                <div
                    class="user-name"
                    id="loggedUserName"
                >
                    User
                </div>

                <div class="user-label">
                    Logged in
                </div>

            </div>


            <button
                type="button"
                class="logout-btn"
                onclick="logout()"
                title="Logout"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

            </button>

        </div>

    </header>



    <main class="container">


        <div class="page-head">

            <div class="page-title">

                <h1>
                    Website Control
                </h1>

                <p>
                    Manage your website cards
                </p>

            </div>


            <button
                type="button"
                class="add-btn"
                onclick="openAddModal()"
            >

                <i class="fa-solid fa-plus"></i>

                <span>
                    Add Website
                </span>

            </button>

        </div>



        <div class="toolbar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search website..."
                    oninput="filterCards()"
                >

            </div>

        </div>



        <div
            class="loading"
            id="loading"
        >

            <i class="fa-solid fa-spinner fa-spin"></i>

            <div style="margin-top:9px;">
                Loading websites...
            </div>

        </div>



        <div
            class="cards"
            id="cards"
        ></div>



        <div
            class="empty"
            id="empty"
        >

            <i class="fa-regular fa-folder-open"></i>

            <div>
                No websites found.
            </div>

        </div>


    </main>

</section>



<!-- =====================================================
     MODAL
===================================================== -->

<div
    class="modal"
    id="cardModal"
>

    <div class="modal-box">


        <div class="modal-head">

            <h2 id="modalTitle">
                Add Website
            </h2>

            <button
                type="button"
                class="close-btn"
                onclick="closeModal()"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>



        <div class="form-grid">


            <div class="form-group">

                <label>
                    Website Name
                </label>

                <input
                    type="text"
                    id="formName"
                    placeholder="Movie World"
                >

            </div>


            <div class="form-group">

                <label>
                    Website Link
                </label>

                <input
                    type="url"
                    id="formLink"
                    placeholder="https://example.com"
                >

            </div>


            <div class="form-group full">

                <label>
                    Logo URL
                </label>

                <input
                    type="url"
                    id="formLogo"
                    placeholder="https://example.com/logo.png"
                >

            </div>


            <div class="form-group full">

                <label>
                    Description
                </label>

                <textarea
                    id="formDescription"
                    placeholder="Access Movie World website"
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    Source
                </label>

                <input
                    type="text"
                    id="formSource"
                    placeholder="Local Server"
                >

            </div>


            <div class="form-group">

                <label>
                    Type
                </label>

                <input
                    type="text"
                    id="formType"
                    placeholder="Movie"
                >

            </div>


            <div class="form-group">

                <label>
                    Position
                </label>

                <input
                    type="number"
                    id="formPosition"
                    min="1"
                    placeholder="1"
                >

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="formStatus">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>


        </div>



        <div class="modal-actions">


            <div class="left-actions">

                <button
                    type="button"
                    class="btn delete-btn"
                    id="deleteBtn"
                    onclick="deleteCurrentCard()"
                    style="display:none;"
                >

                    <i class="fa-solid fa-trash"></i>

                    Delete

                </button>

            </div>


            <div class="right-actions">

                <button
                    type="button"
                    class="btn cancel-btn"
                    onclick="closeModal()"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="btn save-btn"
                    id="saveBtn"
                    onclick="saveCard()"
                >

                    <i class="fa-solid fa-check"></i>

                    Save

                </button>

            </div>


        </div>


    </div>

</div>



<div
    class="toast"
    id="toast"
></div>



<script>

/* =========================================================
   API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzA9gYIhaDKhAIn2XltcoqEUmE6ZP-cGNFOdrnN6xjah7mQd9gbwIyBQWQxqn0JvBoQhQ/exec";


let cards = [];

let editingId = null;


/* =========================================================
   LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        checkSession();

        const input =
            document.getElementById(
                "usernameInput"
            );

        input.addEventListener(
            "keydown",
            function(e){

                if(e.key === "Enter"){
                    login();
                }

            }
        );

    }
);


/* =========================================================
   SESSION
========================================================= */

function checkSession(){

    const logged =
        localStorage.getItem(
            "websiteControlLoggedIn"
        );

    const name =
        localStorage.getItem(
            "websiteControlName"
        );

    if(
        logged === "true" &&
        name
    ){

        showDashboard(name);

    }

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const input =
        document.getElementById(
            "usernameInput"
        );

    const button =
        document.getElementById(
            "loginBtn"
        );

    const username =
        input.value.trim();


    document.getElementById(
        "loginError"
    ).style.display = "none";


    if(!username){

        showLoginError(
            "Please enter your username."
        );

        return;

    }


    button.disabled = true;

    button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';


    try{

        const response =
            await fetch(
                API_URL +
                "?action=login&username=" +
                encodeURIComponent(username) +
                "&ts=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(data.success){

            localStorage.setItem(
                "websiteControlLoggedIn",
                "true"
            );

            localStorage.setItem(
                "websiteControlUsername",
                data.username || username
            );

            localStorage.setItem(
                "websiteControlName",
                data.name || username
            );


            showDashboard(
                data.name || username
            );

        }
        else{

            showLoginError(
                data.message ||
                "Username not found."
            );

        }

    }
    catch(error){

        console.error(error);

        showLoginError(
            "Unable to connect with server."
        );

    }


    button.disabled = false;

    button.innerHTML =
        '<i class="fa-solid fa-right-to-bracket"></i>&nbsp; Login';

}


/* =========================================================
   LOGIN ERROR
========================================================= */

function showLoginError(message){

    const error =
        document.getElementById(
            "loginError"
        );

    error.textContent =
        message;

    error.style.display =
        "block";

}


/* =========================================================
   DASHBOARD
========================================================= */

function showDashboard(name){

    document.getElementById(
        "loginScreen"
    ).style.display =
        "none";

    document.getElementById(
        "dashboard"
    ).style.display =
        "block";

    document.getElementById(
        "loggedUserName"
    ).textContent =
        name;

    loadCards();

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    localStorage.removeItem(
        "websiteControlLoggedIn"
    );

    localStorage.removeItem(
        "websiteControlUsername"
    );

    localStorage.removeItem(
        "websiteControlName"
    );

    cards = [];

    document.getElementById(
        "dashboard"
    ).style.display =
        "none";

    document.getElementById(
        "loginScreen"
    ).style.display =
        "flex";

    document.getElementById(
        "usernameInput"
    ).value =
        "";

}


/* =========================================================
   LOAD CARDS
========================================================= */

async function loadCards(){

    const loading =
        document.getElementById(
            "loading"
        );

    const box =
        document.getElementById(
            "cards"
        );


    loading.style.display =
        "block";

    box.innerHTML =
        "";


    try{

        const response =
            await fetch(
                API_URL +
                "?action=getCards&ts=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Failed to load websites."
            );

        }


        cards =
            Array.isArray(data.cards)
            ? data.cards
            : [];


        renderCards();

    }
    catch(error){

        console.error(error);

        showToast(
            error.message ||
            "Failed to load websites.",
            "error"
        );

    }


    loading.style.display =
        "none";

}


/* =========================================================
   RENDER
========================================================= */

function renderCards(){

    const box =
        document.getElementById(
            "cards"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    box.innerHTML = "";


    const filtered =
        cards.filter(
            card => {

                if(
                    String(
                        card.status ||
                        "Active"
                    ).toLowerCase()
                    ===
                    "inactive"
                ){

                    return false;

                }


                if(!search){
                    return true;
                }


                const text = (
                    card.name +
                    " " +
                    card.description +
                    " " +
                    card.source +
                    " " +
                    card.type
                ).toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    if(filtered.length === 0){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        card => {

            box.appendChild(
                createCard(card)
            );

        }
    );

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(card){

    const article =
        document.createElement(
            "article"
        );

    article.className =
        "card";


    const initials =
        getInitials(
            card.name
        );


    const logo =
        card.logo
        ?
        `
        <img
            src="${escapeAttribute(card.logo)}"
            alt=""
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
        >

        <div
            class="logo-fallback"
            style="display:none;"
        >
            ${escapeHTML(initials)}
        </div>
        `
        :
        `
        <div class="logo-fallback">
            ${escapeHTML(initials)}
        </div>
        `;


    article.innerHTML = `

        <div class="card-top">

            <div class="logo">

                ${logo}

            </div>


            <div class="card-title">

                <h3>
                    ${escapeHTML(
                        card.name ||
                        "Unnamed Website"
                    )}
                </h3>

                <span>
                    ${escapeHTML(
                        card.type ||
                        "Website"
                    )}
                </span>

            </div>

        </div>


        <div class="card-description">

            ${escapeHTML(
                card.description ||
                "Access website"
            )}

        </div>


        <div class="meta">

            ${
                card.source
                ?
                `
                <span>
                    <i class="fa-solid fa-server"></i>
                    ${escapeHTML(card.source)}
                </span>
                `
                :
                ""
            }

            ${
                card.type
                ?
                `
                <span>
                    <i class="fa-solid fa-tag"></i>
                    ${escapeHTML(card.type)}
                </span>
                `
                :
                ""
            }

        </div>


        <div class="card-bottom">

            <a
                class="open-btn"
                href="${escapeAttribute(card.link)}"
                target="_blank"
                rel="noopener noreferrer"
            >

                <i class="fa-solid fa-arrow-up-right-from-square"></i>

                Open

            </a>


            <button
                type="button"
                class="edit-btn"
                onclick="openEditModal('${escapeAttribute(card.id)}')"
            >

                <i class="fa-solid fa-pen"></i>

            </button>

        </div>

    `;


    return article;

}


/* =========================================================
   SEARCH
========================================================= */

function filterCards(){
    renderCards();
}


/* =========================================================
   ADD
========================================================= */

function openAddModal(){

    editingId = null;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Website";

    document.getElementById(
        "deleteBtn"
    ).style.display =
        "none";

    clearForm();

    document.getElementById(
        "cardModal"
    ).classList.add(
        "show"
    );

}


/* =========================================================
   EDIT
========================================================= */

function openEditModal(id){

    const card =
        cards.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!card){

        showToast(
            "Website not found.",
            "error"
        );

        return;

    }


    editingId =
        card.id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Website";


    document.getElementById(
        "deleteBtn"
    ).style.display =
        "block";


    document.getElementById(
        "formName"
    ).value =
        card.name || "";


    document.getElementById(
        "formLink"
    ).value =
        card.link || "";


    document.getElementById(
        "formLogo"
    ).value =
        card.logo || "";


    document.getElementById(
        "formDescription"
    ).value =
        card.description || "";


    document.getElementById(
        "formSource"
    ).value =
        card.source || "";


    document.getElementById(
        "formType"
    ).value =
        card.type || "";


    document.getElementById(
        "formPosition"
    ).value =
        card.position || "";


    document.getElementById(
        "formStatus"
    ).value =
        card.status || "Active";


    document.getElementById(
        "cardModal"
    ).classList.add(
        "show"
    );

}


/* =========================================================
   CLEAR
========================================================= */

function clearForm(){

    [
        "formName",
        "formLink",
        "formLogo",
        "formDescription",
        "formSource",
        "formType",
        "formPosition"
    ].forEach(
        id => {

            document.getElementById(
                id
            ).value = "";

        }
    );


    document.getElementById(
        "formStatus"
    ).value =
        "Active";

}


/* =========================================================
   CLOSE
========================================================= */

function closeModal(){

    document.getElementById(
        "cardModal"
    ).classList.remove(
        "show"
    );

    editingId = null;

}


/* =========================================================
   SAVE
========================================================= */

async function saveCard(){

    const payload = {

        action:
            editingId
            ? "updateCard"
            : "addCard",

        id:
            editingId || "",

        name:
            document.getElementById(
                "formName"
            ).value.trim(),

        link:
            document.getElementById(
                "formLink"
            ).value.trim(),

        logo:
            document.getElementById(
                "formLogo"
            ).value.trim(),

        description:
            document.getElementById(
                "formDescription"
            ).value.trim(),

        source:
            document.getElementById(
                "formSource"
            ).value.trim(),

        type:
            document.getElementById(
                "formType"
            ).value.trim(),

        position:
            document.getElementById(
                "formPosition"
            ).value,

        status:
            document.getElementById(
                "formStatus"
            ).value

    };


    if(!payload.name){

        showToast(
            "Website name is required.",
            "error"
        );

        return;

    }


    if(!payload.link){

        showToast(
            "Website link is required.",
            "error"
        );

        return;

    }


    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    saveBtn.disabled = true;

    saveBtn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },
                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Save failed."
            );

        }


        closeModal();


        showToast(
            data.message ||
            "Saved successfully.",
            "success"
        );


        await loadCards();

    }
    catch(error){

        console.error(error);

        showToast(
            error.message ||
            "Save failed.",
            "error"
        );

    }


    saveBtn.disabled = false;

    saveBtn.innerHTML =
        '<i class="fa-solid fa-check"></i> Save';

}


/* =========================================================
   DELETE
========================================================= */

async function deleteCurrentCard(){

    if(!editingId){
        return;
    }


    if(
        !confirm(
            "Are you sure you want to delete this website?"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },
                    body:
                        JSON.stringify({

                            action:
                                "deleteCard",

                            id:
                                editingId

                        })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Delete failed."
            );

        }


        closeModal();


        showToast(
            data.message ||
            "Website deleted.",
            "success"
        );


        await loadCards();

    }
    catch(error){

        showToast(
            error.message ||
            "Delete failed.",
            "error"
        );

    }

}


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


function getInitials(name){

    const words =
        String(
            name || "W"
        )
        .trim()
        .split(/\s+/);


    if(words.length === 1){

        return words[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        words[0][0] +
        words[1][0]
    ).toUpperCase();

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(
    message,
    type
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.className =
        "toast show " +
        (
            type === "error"
            ? "error"
            : "success"
        );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =========================================================
   MODAL OUTSIDE CLICK
========================================================= */

document.getElementById(
    "cardModal"
).addEventListener(
    "click",
    function(e){

        if(
            e.target === this
        ){

            closeModal();

        }

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Escape"
        ){

            closeModal();

        }

    }
);

</script>
