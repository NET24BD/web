<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Website Dashboard</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                #080b10;

            color: #f1f5f9;

            transition:
                background 0.3s ease,
                color 0.3s ease;

            overflow-x: hidden;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            border: 0;
            outline: none;
        }


        /* =====================================================
           LIGHT THEME
        ===================================================== */

        body.light-theme {

            background:
                #f4f7fb;

            color:
                #172033;
        }


        /* =====================================================
           AUTO THEME
        ===================================================== */

        body.auto-theme {
            background: #080b10;
            color: #f1f5f9;
        }


        @media
        (prefers-color-scheme: light) {

            body.auto-theme {

                background:
                    #f4f7fb;

                color:
                    #172033;
            }

        }


        /* =====================================================
           TOP HEADER
        ===================================================== */

        .top-header {

            width: 100%;

            padding:
                22px 20px 16px;

            position:
                sticky;

            top: 0;

            z-index: 100;

            background:
                rgba(8, 11, 16, 0.88);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid rgba(255,255,255,0.07);

            transition:
                background 0.3s ease,
                border-color 0.3s ease;
        }


        body.light-theme .top-header {

            background:
                rgba(244,247,251,0.88);

            border-bottom:
                1px solid rgba(15,23,42,0.08);
        }


        @media
        (prefers-color-scheme: light) {

            body.auto-theme .top-header {

                background:
                    rgba(244,247,251,0.88);

                border-bottom:
                    1px solid rgba(15,23,42,0.08);
            }

        }


        .header-inner {

            width:
                min(1250px, 100%);

            margin:
                0 auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                18px;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            min-width:
                0;
        }


        .brand-icon {

            width:
                48px;

            height:
                48px;

            flex:
                0 0 48px;

            border-radius:
                14px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #15803d
                );

            color:
                #ffffff;

            font-size:
                21px;

            box-shadow:
                0 8px 25px
                rgba(22,163,74,0.25);
        }


        .brand-text {

            min-width:
                0;
        }


        .brand-title {

            font-size:
                19px;

            font-weight:
                750;

            line-height:
                1.2;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        .brand-subtitle {

            margin-top:
                3px;

            font-size:
                12px;

            color:
                #94a3b8;
        }


        body.light-theme .brand-subtitle {
            color: #64748b;
        }


        /* =====================================================
           THEME BUTTONS
        ===================================================== */

        .theme-buttons {

            display:
                flex;

            align-items:
                center;

            gap:
                5px;

            padding:
                4px;

            border-radius:
                12px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.07);
        }


        body.light-theme .theme-buttons {

            background:
                rgba(15,23,42,0.05);

            border-color:
                rgba(15,23,42,0.08);
        }


        .theme-btn {

            width:
                38px;

            height:
                34px;

            border-radius:
                9px;

            background:
                transparent;

            color:
                #94a3b8;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                14px;

            transition:
                all 0.2s ease;
        }


        .theme-btn:hover {

            background:
                rgba(255,255,255,0.08);

            color:
                #ffffff;
        }


        .theme-btn.active {

            background:
                #16a34a;

            color:
                #ffffff;

            box-shadow:
                0 5px 15px
                rgba(22,163,74,0.22);
        }


        body.light-theme .theme-btn:hover {

            background:
                rgba(15,23,42,0.07);

            color:
                #0f172a;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            width:
                min(1250px, 100%);

            margin:
                0 auto;

            padding:
                28px 20px 50px;
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-section {

            margin-bottom:
                25px;
        }


        .search-box {

            position:
                relative;

            width:
                100%;
        }


        .search-icon {

            position:
                absolute;

            left:
                18px;

            top:
                50%;

            transform:
                translateY(-50%);

            color:
                #64748b;

            font-size:
                16px;

            pointer-events:
                none;
        }


        .search-input {

            width:
                100%;

            height:
                52px;

            padding:
                0 50px 0 48px;

            border-radius:
                15px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                #11161e;

            color:
                #f8fafc;

            outline:
                none;

            font-size:
                14px;

            transition:
                all 0.25s ease;
        }


        .search-input::placeholder {
            color: #64748b;
        }


        .search-input:focus {

            border-color:
                rgba(22,163,74,0.7);

            box-shadow:
                0 0 0 4px
                rgba(22,163,74,0.09);
        }


        body.light-theme .search-input {

            background:
                #ffffff;

            color:
                #172033;

            border-color:
                rgba(15,23,42,0.10);
        }


        @media
        (prefers-color-scheme: light) {

            body.auto-theme .search-input {

                background:
                    #ffffff;

                color:
                    #172033;

                border-color:
                    rgba(15,23,42,0.10);
            }

        }


        .clear-search {

            position:
                absolute;

            right:
                14px;

            top:
                50%;

            transform:
                translateY(-50%);

            width:
                30px;

            height:
                30px;

            border-radius:
                8px;

            background:
                transparent;

            color:
                #64748b;

            cursor:
                pointer;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;
        }


        .clear-search:hover {

            background:
                rgba(255,255,255,0.06);

            color:
                #ffffff;
        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .toolbar {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                12px;

            margin-bottom:
                20px;
        }


        .result-count {

            color:
                #94a3b8;

            font-size:
                13px;
        }


        body.light-theme .result-count {
            color: #64748b;
        }


        .refresh-btn {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            padding:
                9px 14px;

            border-radius:
                10px;

            background:
                #11161e;

            border:
                1px solid
                rgba(255,255,255,0.07);

            color:
                #cbd5e1;

            cursor:
                pointer;

            font-size:
                12px;

            transition:
                all 0.2s ease;
        }


        .refresh-btn:hover {

            background:
                #17202b;

            color:
                #ffffff;

            transform:
                translateY(-1px);
        }


        body.light-theme .refresh-btn {

            background:
                #ffffff;

            border-color:
                rgba(15,23,42,0.08);

            color:
                #475569;
        }


        /* =====================================================
           CARD GRID
        ===================================================== */

        .cards-grid {

            display:
                grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap:
                16px;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .website-card {

            min-width:
                0;

            min-height:
                295px;

            padding:
                17px;

            border-radius:
                18px;

            background:
                linear-gradient(
                    145deg,
                    #11161e,
                    #0d1219
                );

            border:
                1px solid
                rgba(255,255,255,0.07);

            position:
                relative;

            overflow:
                hidden;

            display:
                flex;

            flex-direction:
                column;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }


        .website-card::before {

            content:
                "";

            position:
                absolute;

            width:
                130px;

            height:
                130px;

            top:
                -70px;

            right:
                -70px;

            border-radius:
                50%;

            background:
                rgba(22,163,74,0.07);

            pointer-events:
                none;
        }


        .website-card:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(22,163,74,0.32);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.25);
        }


        body.light-theme .website-card {

            background:
                #ffffff;

            border-color:
                rgba(15,23,42,0.08);

            box-shadow:
                0 8px 25px
                rgba(15,23,42,0.05);
        }


        body.light-theme .website-card:hover {

            border-color:
                rgba(22,163,74,0.35);

            box-shadow:
                0 15px 35px
                rgba(15,23,42,0.10);
        }


        @media
        (prefers-color-scheme: light) {

            body.auto-theme .website-card {

                background:
                    #ffffff;

                border-color:
                    rgba(15,23,42,0.08);

                box-shadow:
                    0 8px 25px
                    rgba(15,23,42,0.05);
            }

        }


        /* =====================================================
           CARD TOP
        ===================================================== */

        .card-top {

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

            gap:
                10px;

            position:
                relative;

            z-index:
                1;
        }


        .logo-box {

            width:
                58px;

            height:
                58px;

            border-radius:
                15px;

            background:
                #18202b;

            border:
                1px solid
                rgba(255,255,255,0.08);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            flex:
                0 0 58px;
        }


        body.light-theme .logo-box {

            background:
                #f1f5f9;

            border-color:
                rgba(15,23,42,0.07);
        }


        .logo-box img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            display:
                block;
        }


        .logo-fallback {

            color:
                #22c55e;

            font-size:
                21px;
        }


        .status {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                6px;

            padding:
                6px 9px;

            border-radius:
                999px;

            background:
                rgba(34,197,94,0.09);

            color:
                #4ade80;

            font-size:
                10px;

            font-weight:
                650;

            white-space:
                nowrap;
        }


        .status-dot {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                #22c55e;

            box-shadow:
                0 0 8px
                rgba(34,197,94,0.7);
        }


        /* =====================================================
           CARD BODY
        ===================================================== */

        .card-body {

            padding-top:
                15px;

            position:
                relative;

            z-index:
                1;

            flex:
                1;
        }


        .card-name {

            font-size:
                16px;

            font-weight:
                750;

            line-height:
                1.3;

            color:
                #f8fafc;

            word-break:
                break-word;
        }


        body.light-theme .card-name {
            color: #172033;
        }


        .card-description {

            margin-top:
                6px;

            color:
                #94a3b8;

            font-size:
                12px;

            line-height:
                1.5;

            display:
                -webkit-box;

            -webkit-line-clamp:
                2;

            -webkit-box-orient:
                vertical;

            overflow:
                hidden;
        }


        body.light-theme .card-description {
            color: #64748b;
        }


        /* =====================================================
           INFO
        ===================================================== */

        .card-info {

            margin-top:
                13px;

            display:
                flex;

            flex-direction:
                column;

            gap:
                7px;
        }


        .info-row {

            min-width:
                0;

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            font-size:
                11px;

            line-height:
                1.35;
        }


        .info-label {

            flex:
                0 0 auto;

            display:
                inline-flex;

            align-items:
                center;

            gap:
                5px;

            color:
                #64748b;

            font-weight:
                600;
        }


        .info-label i {

            font-size:
                10px;

            color:
                #22c55e;
        }


        .info-value {

            min-width:
                0;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            color:
                #cbd5e1;
        }


        body.light-theme .info-value {
            color: #475569;
        }


        /* =====================================================
           CARD FOOTER
        ===================================================== */

        .card-footer {

            margin-top:
                15px;

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            position:
                relative;

            z-index:
                1;
        }


        .link-text {

            flex:
                1;

            min-width:
                0;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            color:
                #64748b;

            font-size:
                10px;
        }


        .open-btn {

            flex:
                0 0 auto;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                7px;

            min-height:
                36px;

            padding:
                0 13px;

            border-radius:
                10px;

            background:
                #16a34a;

            color:
                #ffffff;

            font-size:
                11px;

            font-weight:
                700;

            text-decoration:
                none;

            cursor:
                pointer;

            transition:
                all 0.2s ease;

            box-shadow:
                0 7px 18px
                rgba(22,163,74,0.18);
        }


        .open-btn:hover {

            background:
                #15803d;

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 22px
                rgba(22,163,74,0.25);
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            grid-column:
                1 / -1;

            min-height:
                300px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                12px;

            color:
                #94a3b8;

            font-size:
                13px;
        }


        .spinner {

            width:
                34px;

            height:
                34px;

            border:
                3px solid
                rgba(255,255,255,0.08);

            border-top-color:
                #22c55e;

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty-state {

            grid-column:
                1 / -1;

            padding:
                55px 20px;

            text-align:
                center;

            color:
                #64748b;
        }


        .empty-icon {

            width:
                55px;

            height:
                55px;

            margin:
                0 auto 14px;

            border-radius:
                15px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                rgba(255,255,255,0.04);

            color:
                #64748b;

            font-size:
                20px;
        }


        .empty-title {

            color:
                #cbd5e1;

            font-size:
                15px;

            font-weight:
                700;
        }


        .empty-text {

            margin-top:
                5px;

            font-size:
                12px;
        }


        body.light-theme .empty-icon {

            background:
                rgba(15,23,42,0.05);
        }


        body.light-theme .empty-title {
            color: #334155;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error-state {

            grid-column:
                1 / -1;

            padding:
                45px 20px;

            text-align:
                center;
        }


        .error-icon {

            width:
                55px;

            height:
                55px;

            margin:
                0 auto 14px;

            border-radius:
                15px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                rgba(239,68,68,0.08);

            color:
                #f87171;

            font-size:
                20px;
        }


        .error-title {

            color:
                #f8fafc;

            font-size:
                15px;

            font-weight:
                700;
        }


        .error-message {

            max-width:
                600px;

            margin:
                7px auto 15px;

            color:
                #94a3b8;

            font-size:
                12px;

            line-height:
                1.5;
        }


        .retry-btn {

            padding:
                9px 15px;

            border-radius:
                9px;

            background:
                #16a34a;

            color:
                #ffffff;

            font-size:
                12px;

            font-weight:
                650;

            cursor:
                pointer;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            padding:
                5px 20px 25px;

            text-align:
                center;

            color:
                #475569;

            font-size:
                11px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media
        (max-width: 1100px) {

            .cards-grid {

                grid-template-columns:
                    repeat(4, minmax(0, 1fr));

            }

        }


        @media
        (max-width: 850px) {

            .cards-grid {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

            }

        }


        @media
        (max-width: 650px) {

            .top-header {

                padding:
                    15px 14px 12px;

            }


            .main {

                padding:
                    20px 14px 35px;

            }


            .brand-icon {

                width:
                    42px;

                height:
                    42px;

                flex-basis:
                    42px;

                border-radius:
                    12px;

                font-size:
                    18px;

            }


            .brand-title {

                font-size:
                    16px;

            }


            .brand-subtitle {

                font-size:
                    10px;

            }


            .theme-buttons {

                padding:
                    3px;

            }


            .theme-btn {

                width:
                    32px;

                height:
                    30px;

            }


            .cards-grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap:
                    12px;

            }


            .website-card {

                min-height:
                    275px;

                padding:
                    14px;

                border-radius:
                    16px;

            }


            .logo-box {

                width:
                    50px;

                height:
                    50px;

                flex-basis:
                    50px;

                border-radius:
                    13px;

            }


            .card-name {

                font-size:
                    14px;

            }


            .card-description {

                font-size:
                    11px;

            }


            .info-row {

                font-size:
                    10px;

            }


            .open-btn {

                min-height:
                    34px;

                padding:
                    0 10px;

            }


            .link-text {

                display:
                    none;

            }

        }


        @media
        (max-width: 390px) {

            .cards-grid {

                grid-template-columns:
                    1fr;

            }


            .website-card {

                min-height:
                    auto;

            }


            .link-text {

                display:
                    block;

            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-header">

        <div class="header-inner">


            <div class="brand">

                <div class="brand-icon">

                    <i class="fa-solid fa-globe"></i>

                </div>


                <div class="brand-text">

                    <div class="brand-title">
                        Website Dashboard
                    </div>

                    <div class="brand-subtitle">
                        Quick access to your websites
                    </div>

                </div>

            </div>


            <!-- THEME -->

            <div
                class="theme-buttons"
                aria-label="Theme selection"
            >

                <button
                    type="button"
                    class="theme-btn"
                    data-theme="dark"
                    title="Dark"
                >
                    <i class="fa-solid fa-moon"></i>
                </button>


                <button
                    type="button"
                    class="theme-btn"
                    data-theme="light"
                    title="Light"
                >
                    <i class="fa-solid fa-sun"></i>
                </button>


                <button
                    type="button"
                    class="theme-btn"
                    data-theme="auto"
                    title="Auto"
                >
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>

            </div>


        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <!-- SEARCH -->

        <section class="search-section">

            <div class="search-box">

                <i
                    class="fa-solid fa-magnifying-glass search-icon"
                ></i>


                <input
                    type="search"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search website..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="clearSearch"
                    class="clear-search"
                    title="Clear search"
                >

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

        </section>


        <!-- TOOLBAR -->

        <div class="toolbar">

            <div
                class="result-count"
                id="resultCount"
            >
                Loading websites...
            </div>


            <button
                type="button"
                class="refresh-btn"
                id="refreshBtn"
            >

                <i class="fa-solid fa-rotate"></i>

                Refresh

            </button>

        </div>


        <!-- CARDS -->

        <section
            class="cards-grid"
            id="cardsGrid"
        >

            <div class="loading">

                <div class="spinner"></div>

                <div>
                    Loading websites...
                </div>

            </div>

        </section>


    </main>


    <!-- FOOTER -->

    <footer class="footer">

        Website Dashboard

    </footer>



    <script>

        "use strict";


        /* =====================================================
           API
        ===================================================== */

        const API_URL =
            "https://script.google.com/macros/s/AKfycbzA9gYIhaDKhAIn2XltcoqEUmE6ZP-cGNFOdrnN6xjah7mQd9gbwIyBQWQxqn0JvBoQhQ/exec";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const cardsGrid =
            document.getElementById(
                "cardsGrid"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const clearSearch =
            document.getElementById(
                "clearSearch"
            );


        const resultCount =
            document.getElementById(
                "resultCount"
            );


        const refreshBtn =
            document.getElementById(
                "refreshBtn"
            );


        const themeButtons =
            document.querySelectorAll(
                ".theme-btn"
            );


        /* =====================================================
           DATA
        ===================================================== */

        let allCards = [];

        let currentSearch = "";


        /* =====================================================
           INIT
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadTheme();

                loadCards();

            }
        );


        /* =====================================================
           LOAD CARDS
        ===================================================== */

        async function loadCards() {

            showLoading();


            try {

                const url =
                    API_URL +
                    "?action=getCards&t=" +
                    Date.now();


                const response =
                    await fetch(
                        url,
                        {
                            method: "GET",
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server returned HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if (
                    !data ||
                    data.success !== true
                ) {

                    throw new Error(
                        data &&
                        data.message
                            ? data.message
                            : "Unable to load website data."
                    );

                }


                allCards =
                    Array.isArray(data.cards)
                        ? data.cards
                        : [];


                /*
                 * Only active cards
                 */

                allCards =
                    allCards.filter(
                        function (card) {

                            return String(
                                card.status || "Active"
                            )
                            .toLowerCase() ===
                            "active";

                        }
                    );


                /*
                 * Sort by position
                 */

                allCards.sort(
                    function (a, b) {

                        return (
                            Number(a.position || 0) -
                            Number(b.position || 0)
                        );

                    }
                );


                renderCards();


            } catch (error) {

                console.error(
                    "Load cards error:",
                    error
                );


                showError(
                    error.message
                );

            }

        }


        /* =====================================================
           RENDER CARDS
        ===================================================== */

        function renderCards() {

            const query =
                currentSearch
                    .trim()
                    .toLowerCase();


            let filtered =
                allCards;


            if (query) {

                filtered =
                    allCards.filter(
                        function (card) {

                            const searchable =
                                [
                                    card.name,
                                    card.description,
                                    card.source,
                                    card.type,
                                    card.link
                                ]
                                .map(
                                    function (value) {

                                        return String(
                                            value || ""
                                        )
                                        .toLowerCase();

                                    }
                                )
                                .join(" ");


                            return searchable.includes(
                                query
                            );

                        }
                    );

            }


            resultCount.textContent =
                filtered.length +
                " website" +
                (
                    filtered.length === 1
                        ? ""
                        : "s"
                );


            if (
                filtered.length === 0
            ) {

                showEmpty();

                return;

            }


            cardsGrid.innerHTML =
                filtered
                    .map(
                        createCard
                    )
                    .join("");

        }


        /* =====================================================
           CREATE CARD
        ===================================================== */

        function createCard(card) {

            const name =
                escapeHTML(
                    card.name ||
                    "Untitled Website"
                );


            const description =
                escapeHTML(
                    card.description ||
                    "Access website."
                );


            const source =
                escapeHTML(
                    card.source ||
                    "Not specified"
                );


            const type =
                escapeHTML(
                    card.type ||
                    "Website"
                );


            const link =
                safeURL(
                    card.link
                );


            const logo =
                safeURL(
                    card.logo
                );


            let logoHTML;


            if (logo) {

                logoHTML = `

                    <img
                        src="${escapeAttribute(logo)}"
                        alt="${escapeAttribute(name)}"
                        loading="lazy"
                        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
                    >

                    <span
                        class="logo-fallback"
                        style="display:none"
                    >
                        <i class="fa-solid fa-globe"></i>
                    </span>

                `;

            } else {

                logoHTML = `

                    <span class="logo-fallback">

                        <i class="fa-solid fa-globe"></i>

                    </span>

                `;

            }


            return `

                <article class="website-card">


                    <div class="card-top">


                        <div class="logo-box">

                            ${logoHTML}

                        </div>


                        <div class="status">

                            <span class="status-dot"></span>

                            Online

                        </div>


                    </div>


                    <div class="card-body">


                        <h2 class="card-name">

                            ${name}

                        </h2>


                        <p class="card-description">

                            ${description}

                        </p>


                        <div class="card-info">


                            <div class="info-row">

                                <span class="info-label">

                                    <i class="fa-solid fa-server"></i>

                                    Source

                                </span>


                                <span
                                    class="info-value"
                                    title="${escapeAttribute(source)}"
                                >

                                    ${source}

                                </span>

                            </div>


                            <div class="info-row">

                                <span class="info-label">

                                    <i class="fa-solid fa-layer-group"></i>

                                    Type

                                </span>


                                <span
                                    class="info-value"
                                    title="${escapeAttribute(type)}"
                                >

                                    ${type}

                                </span>

                            </div>


                        </div>


                    </div>


                    <div class="card-footer">


                        <span
                            class="link-text"
                            title="${escapeAttribute(link)}"
                        >

                            ${escapeHTML(
                                displayURL(link)
                            )}

                        </span>


                        <a
                            href="${escapeAttribute(link)}"
                            class="open-btn"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            Open

                            <i class="fa-solid fa-arrow-up-right-from-square"></i>

                        </a>


                    </div>


                </article>

            `;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        function showLoading() {

            resultCount.textContent =
                "Loading websites...";


            cardsGrid.innerHTML = `

                <div class="loading">

                    <div class="spinner"></div>

                    <div>
                        Loading websites...
                    </div>

                </div>

            `;

        }


        /* =====================================================
           EMPTY
        ===================================================== */

        function showEmpty() {

            cardsGrid.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">

                        <i class="fa-solid fa-magnifying-glass"></i>

                    </div>


                    <div class="empty-title">

                        No website found

                    </div>


                    <div class="empty-text">

                        Try another search keyword.

                    </div>

                </div>

            `;

        }


        /* =====================================================
           ERROR
        ===================================================== */

        function showError(message) {

            resultCount.textContent =
                "Unable to load websites";


            cardsGrid.innerHTML = `

                <div class="error-state">

                    <div class="error-icon">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                    </div>


                    <div class="error-title">

                        Unable to load websites

                    </div>


                    <div class="error-message">

                        ${escapeHTML(
                            message ||
                            "Please check the Apps Script API and try again."
                        )}

                    </div>


                    <button
                        type="button"
                        class="retry-btn"
                        onclick="loadCards()"
                    >

                        <i class="fa-solid fa-rotate"></i>

                        Try Again

                    </button>

                </div>

            `;

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        searchInput.addEventListener(
            "input",
            function () {

                currentSearch =
                    this.value;


                clearSearch.style.display =
                    this.value
                        ? "flex"
                        : "none";


                renderCards();

            }
        );


        clearSearch.addEventListener(
            "click",
            function () {

                searchInput.value =
                    "";

                currentSearch =
                    "";

                clearSearch.style.display =
                    "none";

                searchInput.focus();

                renderCards();

            }
        );


        /* =====================================================
           REFRESH
        ===================================================== */

        refreshBtn.addEventListener(
            "click",
            async function () {

                const icon =
                    refreshBtn.querySelector(
                        "i"
                    );


                icon.classList.add(
                    "fa-spin"
                );


                await loadCards();


                setTimeout(
                    function () {

                        icon.classList.remove(
                            "fa-spin"
                        );

                    },
                    300
                );

            }
        );


        /* =====================================================
           THEME
        ===================================================== */

        themeButtons.forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const theme =
                            this.dataset.theme;


                        setTheme(
                            theme
                        );

                    }
                );

            }
        );


        function setTheme(theme) {

            document.body.classList.remove(
                "dark-theme",
                "light-theme",
                "auto-theme"
            );


            if (
                theme === "light"
            ) {

                document.body.classList.add(
                    "light-theme"
                );

            }

            else if (
                theme === "auto"
            ) {

                document.body.classList.add(
                    "auto-theme"
                );

            }

            else {

                document.body.classList.add(
                    "dark-theme"
                );

            }


            localStorage.setItem(
                "websiteDashboardTheme",
                theme
            );


            updateThemeButtons(
                theme
            );

        }


        function loadTheme() {

            const saved =
                localStorage.getItem(
                    "websiteDashboardTheme"
                ) ||
                "dark";


            setTheme(
                saved
            );

        }


        function updateThemeButtons(
            theme
        ) {

            themeButtons.forEach(
                function (button) {

                    button.classList.toggle(
                        "active",
                        button.dataset.theme ===
                        theme
                    );

                }
            );

        }


        /* =====================================================
           SAFE URL
        ===================================================== */

        function safeURL(value) {

            const url =
                String(
                    value || ""
                )
                .trim();


            if (!url) {

                return "#";

            }


            /*
             * Allow only http / https
             */

            try {

                const parsed =
                    new URL(
                        url
                    );


                if (
                    parsed.protocol !==
                        "http:" &&
                    parsed.protocol !==
                        "https:"
                ) {

                    return "#";

                }


                return parsed.href;

            } catch (error) {

                return "#";

            }

        }


        /* =====================================================
           DISPLAY URL
        ===================================================== */

        function displayURL(
            value
        ) {

            if (!value) {

                return "";

            }


            try {

                const parsed =
                    new URL(
                        value
                    );


                return (
                    parsed.host +
                    (
                        parsed.pathname !==
                        "/"
                            ? parsed.pathname
                            : ""
                    )
                );

            } catch (error) {

                return value;

            }

        }


        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value || ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =====================================================
           ATTRIBUTE ESCAPE
        ===================================================== */

        function escapeAttribute(
            value
        ) {

            return escapeHTML(
                value
            );

        }


        /* =====================================================
           GLOBAL
        ===================================================== */

        window.loadCards =
            loadCards;

    </script>


</body>

</html>
