<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Website Dashboard</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:#080b10;

    color:#f1f5f9;

    overflow-x:hidden;

    transition:
        background .3s ease,
        color .3s ease;
}

button,
input{
    font-family:inherit;
}

button{
    outline:none;
    border:0;
}


/* =========================================================
   LIGHT THEME
========================================================= */

body.light-theme{

    background:#f4f7fb;

    color:#172033;
}


/* =========================================================
   AUTO THEME
========================================================= */

body.auto-theme{

    background:#080b10;

    color:#f1f5f9;
}

@media(prefers-color-scheme:light){

    body.auto-theme{

        background:#f4f7fb;

        color:#172033;
    }
}


/* =========================================================
   HEADER
========================================================= */

.top-header{

    width:100%;

    position:sticky;

    top:0;

    z-index:100;

    padding:
        15px 20px 13px;

    background:
        rgba(8,11,16,.90);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

body.light-theme .top-header{

    background:
        rgba(244,247,251,.90);

    border-bottom:
        1px solid
        rgba(15,23,42,.08);
}

@media(prefers-color-scheme:light){

    body.auto-theme .top-header{

        background:
            rgba(244,247,251,.90);

        border-bottom:
            1px solid
            rgba(15,23,42,.08);
    }
}


.header-inner{

    width:
        min(1250px,100%);

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;
}


.brand-icon{

    width:42px;

    height:42px;

    flex:0 0 42px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #15803d
        );

    color:#fff;

    font-size:18px;

    box-shadow:
        0 7px 20px
        rgba(22,163,74,.22);
}


.brand-text{
    min-width:0;
}


.brand-title{

    font-size:17px;

    font-weight:750;

    line-height:1.2;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.brand-subtitle{

    margin-top:2px;

    color:#64748b;

    font-size:10px;
}


/* =========================================================
   THEME BUTTONS
========================================================= */

.theme-buttons{

    display:flex;

    align-items:center;

    gap:4px;

    padding:3px;

    border-radius:10px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.07);
}

body.light-theme .theme-buttons{

    background:
        rgba(15,23,42,.05);

    border-color:
        rgba(15,23,42,.08);
}


.theme-btn{

    width:34px;

    height:30px;

    border-radius:8px;

    background:transparent;

    color:#64748b;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:12px;

    transition:.2s ease;
}


.theme-btn:hover{

    background:
        rgba(255,255,255,.08);

    color:#fff;
}


.theme-btn.active{

    background:#16a34a;

    color:#fff;

    box-shadow:
        0 4px 12px
        rgba(22,163,74,.20);
}


/* =========================================================
   MAIN
========================================================= */

.main{

    width:
        min(1250px,100%);

    margin:auto;

    padding:
        20px 20px 40px;
}


/* =========================================================
   TOP TOOLBAR
========================================================= */

.top-toolbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-section{

    flex:1;

    margin:0;
}


.search-box{

    position:relative;

    width:100%;

    max-width:430px;
}


.search-input{

    width:100%;

    height:44px;

    padding:
        0 42px 0 42px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:#11161e;

    color:#f8fafc;

    outline:none;

    font-size:12px;

    transition:.2s ease;
}


.search-input::placeholder{

    color:#64748b;
}


.search-input:focus{

    border-color:
        rgba(22,163,74,.65);

    box-shadow:
        0 0 0 3px
        rgba(22,163,74,.08);
}


body.light-theme .search-input{

    background:#fff;

    color:#172033;

    border-color:
        rgba(15,23,42,.10);
}


@media(prefers-color-scheme:light){

    body.auto-theme .search-input{

        background:#fff;

        color:#172033;

        border-color:
            rgba(15,23,42,.10);
    }
}


.search-icon{

    position:absolute;

    left:15px;

    top:50%;

    transform:
        translateY(-50%);

    color:#64748b;

    font-size:13px;

    pointer-events:none;
}


.clear-search{

    position:absolute;

    right:8px;

    top:50%;

    transform:
        translateY(-50%);

    width:28px;

    height:28px;

    border-radius:7px;

    background:transparent;

    color:#64748b;

    cursor:pointer;

    display:none;

    align-items:center;

    justify-content:center;
}


/* =========================================================
   TOOLBAR RIGHT
========================================================= */

.toolbar-right{

    display:flex;

    align-items:center;

    gap:8px;
}


.result-count{

    color:#64748b;

    font-size:11px;

    white-space:nowrap;
}


.refresh-btn{

    height:36px;

    padding:
        0 11px;

    border-radius:9px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    background:#11161e;

    border:
        1px solid
        rgba(255,255,255,.07);

    color:#94a3b8;

    cursor:pointer;

    font-size:10px;

    transition:.2s ease;
}


.refresh-btn:hover{

    background:#17202b;

    color:#fff;

    transform:
        translateY(-1px);
}


body.light-theme .refresh-btn{

    background:#fff;

    border-color:
        rgba(15,23,42,.08);

    color:#475569;
}


/* =========================================================
   CARD GRID
========================================================= */

.cards-grid{

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:12px;
}


/* =========================================================
   CARD
========================================================= */

.website-card{

    min-width:0;

    min-height:235px;

    padding:13px;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #11161e,
            #0d1219
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    position:relative;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}


.website-card::before{

    content:"";

    position:absolute;

    width:100px;

    height:100px;

    right:-55px;

    top:-55px;

    border-radius:50%;

    background:
        rgba(22,163,74,.07);

    pointer-events:none;
}


.website-card:hover{

    transform:
        translateY(-3px);

    border-color:
        rgba(22,163,74,.35);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.22);
}


body.light-theme .website-card{

    background:#fff;

    border-color:
        rgba(15,23,42,.08);

    box-shadow:
        0 6px 20px
        rgba(15,23,42,.05);
}


body.light-theme .website-card:hover{

    border-color:
        rgba(22,163,74,.35);

    box-shadow:
        0 12px 28px
        rgba(15,23,42,.10);
}


@media(prefers-color-scheme:light){

    body.auto-theme .website-card{

        background:#fff;

        border-color:
            rgba(15,23,42,.08);

        box-shadow:
            0 6px 20px
            rgba(15,23,42,.05);
    }
}


/* =========================================================
   CARD TOP
========================================================= */

.card-top{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:8px;

    position:relative;

    z-index:1;
}


.logo-box{

    width:46px;

    height:46px;

    flex:0 0 46px;

    border-radius:11px;

    background:#18202b;

    border:
        1px solid
        rgba(255,255,255,.07);

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}


body.light-theme .logo-box{

    background:#f1f5f9;

    border-color:
        rgba(15,23,42,.07);
}


.logo-box img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}


.logo-fallback{

    color:#22c55e;

    font-size:17px;
}


.status{

    display:inline-flex;

    align-items:center;

    gap:5px;

    padding:
        5px 7px;

    border-radius:999px;

    background:
        rgba(34,197,94,.09);

    color:#4ade80;

    font-size:9px;

    font-weight:650;

    white-space:nowrap;
}


.status-dot{

    width:5px;

    height:5px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:
        0 0 7px
        rgba(34,197,94,.7);
}


/* =========================================================
   CARD BODY
========================================================= */

.card-body{

    padding-top:10px;

    position:relative;

    z-index:1;

    flex:1;
}


.card-name{

    font-size:14px;

    font-weight:700;

    line-height:1.25;

    color:#f8fafc;

    word-break:break-word;
}


body.light-theme .card-name{
    color:#172033;
}


.card-description{

    margin-top:4px;

    color:#94a3b8;

    font-size:10.5px;

    line-height:1.4;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}


body.light-theme .card-description{
    color:#64748b;
}


/* =========================================================
   CARD INFO
========================================================= */

.card-info{

    margin-top:9px;

    display:flex;

    flex-direction:column;

    gap:5px;
}


.info-row{

    min-width:0;

    display:flex;

    align-items:center;

    gap:6px;

    font-size:9.5px;

    line-height:1.3;
}


.info-label{

    flex:0 0 auto;

    display:inline-flex;

    align-items:center;

    gap:4px;

    color:#64748b;

    font-weight:600;
}


.info-label i{

    font-size:8px;

    color:#22c55e;
}


.info-value{

    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    color:#cbd5e1;
}


body.light-theme .info-value{
    color:#475569;
}


/* =========================================================
   CARD FOOTER
========================================================= */

.card-footer{

    margin-top:10px;

    display:flex;

    align-items:center;

    gap:7px;

    position:relative;

    z-index:1;
}


.link-text{

    flex:1;

    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    color:#64748b;

    font-size:8.5px;
}


.open-btn{

    flex:0 0 auto;

    height:30px;

    padding:
        0 10px;

    border-radius:8px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    background:#16a34a;

    color:#fff;

    font-size:10px;

    font-weight:700;

    text-decoration:none;

    transition:.2s ease;
}


.open-btn:hover{

    background:#15803d;

    transform:
        translateY(-1px);

    box-shadow:
        0 6px 15px
        rgba(22,163,74,.20);
}


/* =========================================================
   LOADING
========================================================= */

.loading{

    grid-column:1/-1;

    min-height:260px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:10px;

    color:#94a3b8;

    font-size:12px;
}


.spinner{

    width:30px;

    height:30px;

    border:
        3px solid
        rgba(255,255,255,.08);

    border-top-color:#22c55e;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state{

    grid-column:1/-1;

    padding:50px 20px;

    text-align:center;

    color:#64748b;
}


.empty-icon{

    width:52px;

    height:52px;

    margin:
        0 auto 12px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(255,255,255,.04);

    font-size:18px;
}


.empty-title{

    color:#cbd5e1;

    font-size:14px;

    font-weight:700;
}


.empty-text{

    margin-top:5px;

    font-size:11px;
}


body.light-theme .empty-icon{

    background:
        rgba(15,23,42,.05);
}


body.light-theme .empty-title{

    color:#334155;
}


/* =========================================================
   ERROR
========================================================= */

.error-state{

    grid-column:1/-1;

    padding:45px 20px;

    text-align:center;
}


.error-icon{

    width:52px;

    height:52px;

    margin:
        0 auto 12px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(239,68,68,.08);

    color:#f87171;

    font-size:18px;
}


.error-title{

    color:#f8fafc;

    font-size:14px;

    font-weight:700;
}


.error-message{

    max-width:600px;

    margin:
        6px auto 13px;

    color:#94a3b8;

    font-size:11px;

    line-height:1.5;
}


.retry-btn{

    padding:
        8px 13px;

    border-radius:8px;

    background:#16a34a;

    color:#fff;

    font-size:11px;

    cursor:pointer;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    padding:
        5px 20px 22px;

    text-align:center;

    color:#475569;

    font-size:10px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .cards-grid{

        grid-template-columns:
            repeat(4,minmax(0,1fr));
    }
}


@media(max-width:850px){

    .cards-grid{

        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }
}


@media(max-width:650px){

    .top-header{

        padding:
            12px 14px 10px;
    }


    .main{

        padding:
            15px 14px 30px;
    }


    .brand-icon{

        width:38px;

        height:38px;

        flex-basis:38px;

        border-radius:10px;

        font-size:16px;
    }


    .brand-title{

        font-size:15px;
    }


    .brand-subtitle{

        font-size:9px;
    }


    .theme-btn{

        width:31px;

        height:28px;
    }


    .top-toolbar{

        gap:8px;
    }


    .search-box{

        max-width:none;
    }


    .result-count{

        display:none;
    }


    .refresh-btn{

        height:34px;

        padding:
            0 9px;
    }


    .cards-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:10px;
    }


    .website-card{

        min-height:220px;

        padding:11px;

        border-radius:12px;
    }


    .logo-box{

        width:42px;

        height:42px;

        flex-basis:42px;

        border-radius:10px;
    }


    .card-name{

        font-size:13px;
    }


    .card-description{

        font-size:10px;
    }


    .info-row{

        font-size:9px;
    }


    .open-btn{

        height:29px;

        padding:
            0 9px;
    }


    .link-text{

        display:none;
    }
}


@media(max-width:390px){

    .cards-grid{

        grid-template-columns:1fr;
    }


    .website-card{

        min-height:auto;
    }


    .link-text{

        display:block;
    }
}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="top-header">

    <div class="header-inner">


        <div class="brand">

            <div class="brand-icon">

                <i class="fa-solid fa-globe"></i>

            </div>


            <div class="brand-text">

                <div class="brand-title">
                    Website Dashboard
                </div>

                <div class="brand-subtitle">
                    Quick access to your websites
                </div>

            </div>

        </div>


        <!-- THEME -->

        <div
            class="theme-buttons"
            aria-label="Theme selection"
        >

            <button
                type="button"
                class="theme-btn"
                data-theme="dark"
                title="Dark"
            >
                <i class="fa-solid fa-moon"></i>
            </button>


            <button
                type="button"
                class="theme-btn"
                data-theme="light"
                title="White"
            >
                <i class="fa-solid fa-sun"></i>
            </button>


            <button
                type="button"
                class="theme-btn"
                data-theme="auto"
                title="Auto"
            >
                <i class="fa-solid fa-circle-half-stroke"></i>
            </button>

        </div>

    </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


    <!-- SEARCH / TOOLBAR -->

    <div class="top-toolbar">


        <section class="search-section">

            <div class="search-box">

                <i
                    class="fa-solid fa-magnifying-glass search-icon"
                ></i>


                <input
                    type="search"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search website..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="clearSearch"
                    class="clear-search"
                    title="Clear"
                >

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

        </section>


        <div class="toolbar-right">

            <div
                class="result-count"
                id="resultCount"
            >
                Loading...
            </div>


            <button
                type="button"
                class="refresh-btn"
                id="refreshBtn"
            >

                <i class="fa-solid fa-rotate"></i>

                Refresh

            </button>

        </div>

    </div>


    <!-- CARDS -->

    <section
        class="cards-grid"
        id="cardsGrid"
    >

        <div class="loading">

            <div class="spinner"></div>

            <div>
                Loading websites...
            </div>

        </div>

    </section>


</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="footer">

    Website Dashboard

</footer>



<script>

/* =========================================================
   API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzA9gYIhaDKhAIn2XltcoqEUmE6ZP-cGNFOdrnN6xjah7mQd9gbwIyBQWQxqn0JvBoQhQ/exec";


/* =========================================================
   ELEMENTS
========================================================= */

const cardsGrid =
document.getElementById("cardsGrid");

const searchInput =
document.getElementById("searchInput");

const clearSearch =
document.getElementById("clearSearch");

const resultCount =
document.getElementById("resultCount");

const refreshBtn =
document.getElementById("refreshBtn");

const themeButtons =
document.querySelectorAll(".theme-btn");


/* =========================================================
   DATA
========================================================= */

let allCards = [];

let currentSearch = "";


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadTheme();

        loadCards();

    }
);


/* =========================================================
   LOAD CARDS
========================================================= */

async function loadCards(){

    showLoading();


    try{

        const url =
            API_URL +
            "?action=getCards&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Server error: HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if(
            !data ||
            data.success !== true
        ){

            throw new Error(
                data &&
                data.message
                    ? data.message
                    : "Unable to load website data."
            );
        }


        allCards =
            Array.isArray(data.cards)
                ? data.cards
                : [];


        /*
         * Active cards only
         */

        allCards =
            allCards.filter(
                function(card){

                    return String(
                        card.status || "Active"
                    )
                    .trim()
                    .toLowerCase()
                    === "active";

                }
            );


        /*
         * Position অনুযায়ী sort
         */

        allCards.sort(
            function(a,b){

                return (
                    Number(a.position || 0) -
                    Number(b.position || 0)
                );

            }
        );


        renderCards();

    }

    catch(error){

        console.error(
            "Load Cards Error:",
            error
        );


        showError(
            error.message
        );

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderCards(){

    const query =
        currentSearch
            .trim()
            .toLowerCase();


    let filtered =
        allCards;


    if(query){

        filtered =
            allCards.filter(
                function(card){

                    const searchable =
                        [
                            card.name,
                            card.description,
                            card.source,
                            card.type,
                            card.link
                        ]
                        .map(
                            function(value){

                                return String(
                                    value || ""
                                )
                                .toLowerCase();

                            }
                        )
                        .join(" ");


                    return searchable.includes(
                        query
                    );

                }
            );

    }


    resultCount.textContent =
        filtered.length +
        " website" +
        (
            filtered.length === 1
                ? ""
                : "s"
        );


    if(filtered.length === 0){

        showEmpty();

        return;
    }


    cardsGrid.innerHTML =
        filtered
        .map(createCard)
        .join("");

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(card){

    const name =
        escapeHTML(
            card.name ||
            "Untitled Website"
        );


    const description =
        escapeHTML(
            card.description ||
            "Access website."
        );


    const source =
        escapeHTML(
            card.source ||
            "Not specified"
        );


    const type =
        escapeHTML(
            card.type ||
            "Website"
        );


    const link =
        safeURL(
            card.link
        );


    const customLogo =
        safeURL(
            card.logo
        );

    const favicon =
        getFavicon(
            link
        );

    const logo =
        customLogo ||
        favicon;


    let logoHTML;


    if(logo){

        logoHTML = `

            <img
                src="${escapeAttribute(logo)}"
                alt="${escapeAttribute(name)}"
                loading="lazy"
                onerror="
                    ${
                        favicon && logo !== favicon
                            ? `this.src='${escapeAttribute(favicon)}';`
                            : "this.style.display='none';"
                    }
                    ${
                        favicon && logo !== favicon
                            ? ""
                            : "this.nextElementSibling.style.display='flex';"
                    }
                "
            >

            <span
                class="logo-fallback"
                style="display:none"
            >

                <i class="fa-solid fa-globe"></i>

            </span>

        `;

    }

    else{

        logoHTML = `

            <span class="logo-fallback">

                <i class="fa-solid fa-globe"></i>

            </span>

        `;

    }


    return `

        <article class="website-card">


            <div class="card-top">


                <div class="logo-box">

                    ${logoHTML}

                </div>


                <div class="status">

                    <span class="status-dot"></span>

                    Online

                </div>


            </div>


            <div class="card-body">


                <h2 class="card-name">

                    ${name}

                </h2>


                <p class="card-description">

                    ${description}

                </p>


                <div class="card-info">


                    <div class="info-row">

                        <span class="info-label">

                            <i class="fa-solid fa-server"></i>

                            Source

                        </span>


                        <span
                            class="info-value"
                            title="${escapeAttribute(source)}"
                        >

                            ${source}

                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">

                            <i class="fa-solid fa-layer-group"></i>

                            Type

                        </span>


                        <span
                            class="info-value"
                            title="${escapeAttribute(type)}"
                        >

                            ${type}

                        </span>

                    </div>


                </div>


            </div>


            <div class="card-footer">


                <span
                    class="link-text"
                    title="${escapeAttribute(link)}"
                >

                    ${escapeHTML(
                        displayURL(link)
                    )}

                </span>


                <a
                    href="${escapeAttribute(link)}"
                    class="open-btn"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    Open

                    <i class="fa-solid fa-arrow-up-right-from-square"></i>

                </a>


            </div>


        </article>

    `;

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

    resultCount.textContent =
        "Loading websites...";


    cardsGrid.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            <div>
                Loading websites...
            </div>

        </div>

    `;

}


/* =========================================================
   EMPTY
========================================================= */

function showEmpty(){

    cardsGrid.innerHTML = `

        <div class="empty-state">

            <div class="empty-icon">

                <i class="fa-solid fa-magnifying-glass"></i>

            </div>


            <div class="empty-title">

                No website found

            </div>


            <div class="empty-text">

                Try another search keyword.

            </div>

        </div>

    `;

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    resultCount.textContent =
        "Unable to load";


    cardsGrid.innerHTML = `

        <div class="error-state">

            <div class="error-icon">

                <i class="fa-solid fa-triangle-exclamation"></i>

            </div>


            <div class="error-title">

                Unable to load websites

            </div>


            <div class="error-message">

                ${escapeHTML(
                    message ||
                    "Please check your Apps Script API."
                )}

            </div>


            <button
                type="button"
                class="retry-btn"
                onclick="loadCards()"
            >

                <i class="fa-solid fa-rotate"></i>

                Try Again

            </button>

        </div>

    `;

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function(){

        currentSearch =
            this.value;


        clearSearch.style.display =
            this.value
                ? "flex"
                : "none";


        renderCards();

    }
);


clearSearch.addEventListener(
    "click",
    function(){

        searchInput.value = "";

        currentSearch = "";

        clearSearch.style.display =
            "none";

        searchInput.focus();

        renderCards();

    }
);


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
    "click",
    async function(){

        const icon =
            refreshBtn.querySelector("i");


        icon.classList.add(
            "fa-spin"
        );


        await loadCards();


        setTimeout(
            function(){

                icon.classList.remove(
                    "fa-spin"
                );

            },
            300
        );

    }
);


/* =========================================================
   THEME
========================================================= */

themeButtons.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                setTheme(
                    this.dataset.theme
                );

            }
        );

    }
);


function setTheme(theme){

    document.body.classList.remove(
        "dark-theme",
        "light-theme",
        "auto-theme"
    );


    if(theme === "light"){

        document.body.classList.add(
            "light-theme"
        );

    }

    else if(theme === "auto"){

        document.body.classList.add(
            "auto-theme"
        );

    }

    else{

        document.body.classList.add(
            "dark-theme"
        );

    }


    localStorage.setItem(
        "websiteDashboardTheme",
        theme
    );


    updateThemeButtons(
        theme
    );

}


function loadTheme(){

    const saved =
        localStorage.getItem(
            "websiteDashboardTheme"
        ) ||
        "dark";


    setTheme(saved);

}


function updateThemeButtons(theme){

    themeButtons.forEach(
        function(button){

            button.classList.toggle(
                "active",
                button.dataset.theme ===
                theme
            );

        }
    );

}


/* =========================================================
   SAFE URL
========================================================= */

function getFavicon(value){

    const url =
        String(value || "")
        .trim();

    if(!url){
        return "";
    }

    try{

        const parsed =
            new URL(url);

        if(
            parsed.protocol !== "http:" &&
            parsed.protocol !== "https:"
        ){
            return "";
        }

        return (
            "https://www.google.com/s2/favicons?domain=" +
            encodeURIComponent(parsed.hostname) +
            "&sz=128"
        );

    }

    catch(error){

        return "";
    }

}


/* =========================================================
   SAFE URL
   ========================================================= */

function safeURL(value){

    const url =
        String(value || "")
        .trim();


    if(!url){

        return "#";
    }


    try{

        const parsed =
            new URL(url);


        if(
            parsed.protocol !== "http:" &&
            parsed.protocol !== "https:"
        ){

            return "#";
        }


        return parsed.href;

    }

    catch(error){

        return "#";
    }

}


/* =========================================================
   DISPLAY URL
========================================================= */

function displayURL(value){

    if(!value){

        return "";
    }


    try{

        const parsed =
            new URL(value);


        return (
            parsed.host +
            (
                parsed.pathname !== "/"
                    ? parsed.pathname
                    : ""
            )
        );

    }

    catch(error){

        return value;
    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =========================================================
   GLOBAL
========================================================= */

window.loadCards =
    loadCards;

</script>
