<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Website Control Dashboard</title>


<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>


<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    font-family:"Inter",sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #182033 0%,
            #0b0f18 42%,
            #070a10 100%
        );

    color:#f8fafc;

    min-height:100vh;

}


/* =========================================================
   LOGIN
========================================================= */

#loginScreen{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.login-box{

    width:100%;

    max-width:400px;

    background:
        rgba(15,23,42,.90);

    border:1px solid
        rgba(255,255,255,.08);

    border-radius:24px;

    padding:32px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.45);

    backdrop-filter:blur(20px);

}


.login-icon{

    width:68px;

    height:68px;

    border-radius:20px;

    margin:0 auto 20px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:28px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    color:white;

    box-shadow:
        0 15px 35px
        rgba(34,197,94,.25);

}


.login-box h1{

    text-align:center;

    font-size:24px;

    margin-bottom:8px;

}


.login-box p{

    text-align:center;

    color:#94a3b8;

    font-size:13px;

    margin-bottom:28px;

}


.input-group{

    margin-bottom:18px;

}


.input-group label{

    display:block;

    font-size:13px;

    font-weight:600;

    margin-bottom:8px;

    color:#cbd5e1;

}


.input-wrap{

    position:relative;

}


.input-wrap i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#64748b;

}


.input-wrap input{

    width:100%;

    height:50px;

    border-radius:12px;

    border:1px solid
        rgba(255,255,255,.09);

    background:#0b1220;

    color:#fff;

    outline:none;

    padding:0 15px 0 45px;

    font-size:14px;

    transition:.2s;

}


.input-wrap input:focus{

    border-color:#22c55e;

    box-shadow:
        0 0 0 3px
        rgba(34,197,94,.10);

}


.login-btn{

    width:100%;

    height:50px;

    border:none;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    color:white;

    font-weight:700;

    font-size:14px;

    cursor:pointer;

    transition:.2s;

}


.login-btn:hover{

    transform:translateY(-1px);

    box-shadow:
        0 12px 25px
        rgba(34,197,94,.20);

}


.login-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}


.login-error{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    background:
        rgba(239,68,68,.10);

    border:1px solid
        rgba(239,68,68,.20);

    color:#fca5a5;

    font-size:13px;

    text-align:center;

}


/* =========================================================
   DASHBOARD
========================================================= */

#dashboard{

    display:none;

    min-height:100vh;

}


.topbar{

    height:72px;

    position:sticky;

    top:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 28px;

    background:
        rgba(7,10,16,.82);

    border-bottom:1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(18px);

}


.brand{

    display:flex;

    align-items:center;

    gap:12px;

}


.brand-logo{

    width:40px;

    height:40px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

}


.brand-text h2{

    font-size:16px;

    font-weight:800;

}


.brand-text span{

    display:block;

    font-size:11px;

    color:#64748b;

    margin-top:2px;

}


.user-area{

    display:flex;

    align-items:center;

    gap:12px;

}


.user-info{

    text-align:right;

}


.user-name{

    font-size:13px;

    font-weight:700;

}


.user-label{

    font-size:10px;

    color:#64748b;

}


.logout-btn{

    width:38px;

    height:38px;

    border-radius:10px;

    border:1px solid
        rgba(255,255,255,.08);

    background:#111827;

    color:#f87171;

    cursor:pointer;

}


.logout-btn:hover{

    background:#1f2937;

}


/* =========================================================
   CONTENT
========================================================= */

.container{

    width:100%;

    max-width:1450px;

    margin:auto;

    padding:30px;

}


.page-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;

}


.page-title h1{

    font-size:27px;

    font-weight:800;

    letter-spacing:-.5px;

}


.page-title p{

    color:#64748b;

    font-size:13px;

    margin-top:6px;

}


.add-btn{

    height:43px;

    padding:0 18px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    color:white;

    font-weight:700;

    cursor:pointer;

    display:flex;

    align-items:center;

    gap:8px;

}


.add-btn:hover{

    box-shadow:
        0 10px 25px
        rgba(34,197,94,.18);

}


/* =========================================================
   SEARCH
========================================================= */

.toolbar{

    display:flex;

    justify-content:flex-end;

    margin-bottom:22px;

}


.search-box{

    width:300px;

    position:relative;

}


.search-box i{

    position:absolute;

    left:14px;

    top:50%;

    transform:translateY(-50%);

    color:#64748b;

}


.search-box input{

    width:100%;

    height:43px;

    border-radius:11px;

    border:1px solid
        rgba(255,255,255,.08);

    background:
        rgba(15,23,42,.75);

    color:#fff;

    outline:none;

    padding:0 15px 0 42px;

}


.search-box input:focus{

    border-color:#22c55e;

}


/* =========================================================
   CARDS
========================================================= */

.cards{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                235px,
                1fr
            )
        );

    gap:16px;

}


.card{

    position:relative;

    min-width:0;

    padding:17px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(20,29,46,.95),
            rgba(10,15,25,.95)
        );

    border:1px solid
        rgba(255,255,255,.07);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

}


.card:hover{

    transform:translateY(-3px);

    border-color:
        rgba(34,197,94,.25);

    box-shadow:
        0 18px 35px
        rgba(0,0,0,.25);

}


.card-top{

    display:flex;

    align-items:center;

    gap:12px;

}


.logo{

    width:48px;

    height:48px;

    min-width:48px;

    border-radius:13px;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#111827;

    border:1px solid
        rgba(255,255,255,.07);

}


.logo img{

    width:100%;

    height:100%;

    object-fit:cover;

}


.logo-fallback{

    font-size:19px;

    font-weight:800;

    color:#22c55e;

}


.card-title{

    min-width:0;

}


.card-title h3{

    font-size:14px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.card-title span{

    display:inline-flex;

    margin-top:5px;

    font-size:9px;

    padding:4px 7px;

    border-radius:6px;

    background:
        rgba(34,197,94,.10);

    color:#4ade80;

}


.card-description{

    color:#94a3b8;

    font-size:11px;

    line-height:1.55;

    margin-top:13px;

    min-height:34px;

}


.meta{

    display:flex;

    gap:7px;

    flex-wrap:wrap;

    margin-top:12px;

}


.meta span{

    font-size:9px;

    color:#94a3b8;

    background:#111827;

    border:1px solid
        rgba(255,255,255,.05);

    padding:5px 7px;

    border-radius:6px;

}


.card-bottom{

    display:flex;

    gap:8px;

    margin-top:15px;

}


.open-btn{

    flex:1;

    height:36px;

    border-radius:9px;

    text-decoration:none;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    font-size:11px;

    font-weight:700;

    background:
        rgba(34,197,94,.10);

    border:1px solid
        rgba(34,197,94,.18);

    color:#4ade80;

}


.open-btn:hover{

    background:
        rgba(34,197,94,.17);

}


.edit-btn{

    width:38px;

    height:36px;

    border-radius:9px;

    border:1px solid
        rgba(255,255,255,.07);

    background:#111827;

    color:#cbd5e1;

    cursor:pointer;

}


.edit-btn:hover{

    color:#4ade80;

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    display:none;

    text-align:center;

    padding:70px 20px;

    color:#64748b;

}


.empty i{

    font-size:40px;

    margin-bottom:15px;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

    text-align:center;

    padding:60px;

    color:#64748b;

}


.loading i{

    font-size:25px;

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    display:none;

    position:fixed;

    inset:0;

    z-index:500;

    background:
        rgba(0,0,0,.70);

    backdrop-filter:blur(8px);

    align-items:center;

    justify-content:center;

    padding:20px;

}


.modal.show{

    display:flex;

}


.modal-box{

    width:100%;

    max-width:570px;

    max-height:
        calc(100vh - 40px);

    overflow-y:auto;

    background:#0f172a;

    border:1px solid
        rgba(255,255,255,.08);

    border-radius:20px;

    padding:24px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.55);

}


.modal-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;

}


.modal-head h2{

    font-size:19px;

}


.close-btn{

    width:35px;

    height:35px;

    border:none;

    border-radius:9px;

    background:#111827;

    color:#94a3b8;

    cursor:pointer;

}


.form-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;

}


.form-group{

    display:flex;

    flex-direction:column;

    gap:7px;

}


.form-group.full{

    grid-column:1 / -1;

}


.form-group label{

    font-size:11px;

    font-weight:600;

    color:#cbd5e1;

}


.form-group input,

.form-group textarea,

.form-group select{

    width:100%;

    border:1px solid
        rgba(255,255,255,.08);

    background:#080d16;

    color:#fff;

    border-radius:9px;

    outline:none;

    padding:11px;

    font-family:inherit;

    font-size:12px;

}


.form-group input{

    height:40px;

}


.form-group textarea{

    min-height:75px;

    resize:vertical;

}


.form-group input:focus,

.form-group textarea:focus,

.form-group select:focus{

    border-color:#22c55e;

}


.modal-actions{

    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:22px;

}


.left-actions,

.right-actions{

    display:flex;

    gap:8px;

}


.btn{

    height:39px;

    padding:0 15px;

    border-radius:9px;

    border:1px solid
        rgba(255,255,255,.08);

    cursor:pointer;

    font-size:11px;

    font-weight:700;

}


.cancel-btn{

    background:#111827;

    color:#cbd5e1;

}


.save-btn{

    background:#22c55e;

    color:white;

    border-color:#22c55e;

}


.delete-btn{

    background:
        rgba(239,68,68,.10);

    color:#f87171;

    border-color:
        rgba(239,68,68,.20);

}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    right:22px;

    bottom:22px;

    z-index:1000;

    min-width:240px;

    padding:13px 16px;

    border-radius:11px;

    background:#111827;

    border:1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.35);

    font-size:12px;

    display:none;

}


.toast.show{

    display:block;

}


.toast.success{

    border-color:
        rgba(34,197,94,.25);

    color:#4ade80;

}


.toast.error{

    border-color:
        rgba(239,68,68,.25);

    color:#f87171;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(
    max-width:700px
){

    .topbar{

        padding:0 15px;

    }


    .brand-text{

        display:none;

    }


    .user-info{

        display:none;

    }


    .container{

        padding:20px 15px;

    }


    .page-head{

        align-items:flex-start;

    }


    .page-title h1{

        font-size:22px;

    }


    .add-btn{

        padding:0 13px;

    }


    .add-btn span{

        display:none;

    }


    .search-box{

        width:100%;

    }


    .toolbar{

        justify-content:stretch;

    }


    .cards{

        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );

        gap:10px;

    }


    .card{

        padding:13px;

        border-radius:14px;

    }


    .card-top{

        gap:8px;

    }


    .logo{

        width:40px;

        height:40px;

        min-width:40px;

        border-radius:10px;

    }


    .card-title h3{

        font-size:12px;

    }


    .card-description{

        font-size:10px;

        margin-top:10px;

    }


    .meta{

        margin-top:9px;

    }


    .meta span{

        font-size:8px;

        padding:4px 5px;

    }


    .open-btn{

        height:32px;

        font-size:9px;

    }


    .edit-btn{

        width:34px;

        height:32px;

    }


    .form-grid{

        grid-template-columns:1fr;

    }


    .form-group.full{

        grid-column:auto;

    }


    .modal-actions{

        flex-direction:column;

    }


    .left-actions,

    .right-actions{

        width:100%;

    }


    .right-actions .btn{

        flex:1;

    }

}


@media(
    max-width:380px
){

    .cards{

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<section id="loginScreen">


    <div class="login-box">


        <div class="login-icon">

            <i class="fa-solid fa-lock"></i>

        </div>


        <h1>

            Control Dashboard

        </h1>


        <p>

            Enter your username to continue

        </p>


        <div class="input-group">

            <label>

                Username

            </label>


            <div class="input-wrap">

                <i class="fa-solid fa-user"></i>


                <input
                    type="text"
                    id="usernameInput"
                    placeholder="Enter username"
                    autocomplete="username"
                >

            </div>

        </div>


        <button
            type="button"
            class="login-btn"
            id="loginBtn"
            onclick="login()"
        >

            <i class="fa-solid fa-right-to-bracket"></i>

            &nbsp;

            Login

        </button>


        <div
            class="login-error"
            id="loginError"
        ></div>


    </div>

</section>



<!-- =====================================================
     DASHBOARD
===================================================== -->

<section id="dashboard">


    <!-- TOPBAR -->

    <header class="topbar">


        <div class="brand">


            <div class="brand-logo">

                <i class="fa-solid fa-layer-group"></i>

            </div>


            <div class="brand-text">

                <h2>

                    Website Control

                </h2>

                <span>

                    Management Dashboard

                </span>

            </div>


        </div>


        <div class="user-area">


            <div class="user-info">

                <div
                    class="user-name"
                    id="loggedUserName"
                >
                    User
                </div>

                <div class="user-label">

                    Logged in

                </div>

            </div>


            <button
                type="button"
                class="logout-btn"
                onclick="logout()"
                title="Logout"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

            </button>


        </div>


    </header>



    <!-- CONTENT -->

    <main class="container">


        <div class="page-head">


            <div class="page-title">

                <h1>

                    Website Control

                </h1>

                <p>

                    Manage your website cards from one place.

                </p>

            </div>


            <button
                type="button"
                class="add-btn"
                onclick="openAddModal()"
            >

                <i class="fa-solid fa-plus"></i>

                <span>

                    Add Website

                </span>

            </button>


        </div>



        <!-- SEARCH -->

        <div class="toolbar">


            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>


                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search website..."
                    oninput="filterCards()"
                >

            </div>


        </div>



        <!-- LOADING -->

        <div
            class="loading"
            id="loading"
        >

            <i class="fa-solid fa-spinner fa-spin"></i>

            <div style="margin-top:10px;">

                Loading websites...

            </div>

        </div>



        <!-- CARDS -->

        <div
            class="cards"
            id="cards"
        ></div>



        <!-- EMPTY -->

        <div
            class="empty"
            id="empty"
        >

            <i class="fa-regular fa-folder-open"></i>

            <div>

                No websites found.

            </div>

        </div>


    </main>

</section>



<!-- =====================================================
     ADD / EDIT MODAL
===================================================== -->

<div
    class="modal"
    id="cardModal"
>


    <div class="modal-box">


        <div class="modal-head">


            <h2 id="modalTitle">

                Add Website

            </h2>


            <button
                type="button"
                class="close-btn"
                onclick="closeModal()"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>


        </div>



        <div class="form-grid">


            <!-- NAME -->

            <div class="form-group">

                <label>

                    Website Name

                </label>

                <input
                    type="text"
                    id="formName"
                    placeholder="Movie World"
                >

            </div>



            <!-- LINK -->

            <div class="form-group">

                <label>

                    Website Link

                </label>

                <input
                    type="url"
                    id="formLink"
                    placeholder="https://example.com"
                >

            </div>



            <!-- LOGO -->

            <div class="form-group full">

                <label>

                    Logo URL

                </label>

                <input
                    type="url"
                    id="formLogo"
                    placeholder="https://example.com/logo.png"
                >

            </div>



            <!-- DESCRIPTION -->

            <div class="form-group full">

                <label>

                    Description

                </label>

                <textarea
                    id="formDescription"
                    placeholder="Access Movie World website"
                ></textarea>

            </div>



            <!-- SOURCE -->

            <div class="form-group">

                <label>

                    Source

                </label>

                <input
                    type="text"
                    id="formSource"
                    placeholder="Local Server"
                >

            </div>



            <!-- TYPE -->

            <div class="form-group">

                <label>

                    Type

                </label>

                <input
                    type="text"
                    id="formType"
                    placeholder="Movie"
                >

            </div>



            <!-- POSITION -->

            <div class="form-group">

                <label>

                    Position

                </label>

                <input
                    type="number"
                    id="formPosition"
                    min="1"
                    placeholder="1"
                >

            </div>



            <!-- STATUS -->

            <div class="form-group">

                <label>

                    Status

                </label>

                <select id="formStatus">

                    <option value="Active">

                        Active

                    </option>

                    <option value="Inactive">

                        Inactive

                    </option>

                </select>

            </div>


        </div>



        <div class="modal-actions">


            <div class="left-actions">

                <button
                    type="button"
                    class="btn delete-btn"
                    id="deleteBtn"
                    onclick="deleteCurrentCard()"
                    style="display:none;"
                >

                    <i class="fa-solid fa-trash"></i>

                    Delete

                </button>

            </div>


            <div class="right-actions">

                <button
                    type="button"
                    class="btn cancel-btn"
                    onclick="closeModal()"
                >

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn save-btn"
                    id="saveBtn"
                    onclick="saveCard()"
                >

                    <i class="fa-solid fa-check"></i>

                    Save

                </button>

            </div>


        </div>


    </div>

</div>



<!-- =====================================================
     TOAST
===================================================== -->

<div
    class="toast"
    id="toast"
></div>



<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://script.google.com/macros/s/AKfycbzA9gYIhaDKhAIn2XltcoqEUmE6ZP-cGNFOdrnN6xjah7mQd9gbwIyBQWQxqn0JvBoQhQ/exec";


/* =========================================================
   GLOBAL
========================================================= */

let cards = [];

let editingId = null;


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        checkSession();


        const usernameInput =
            document.getElementById(
                "usernameInput"
            );


        usernameInput.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Enter"
                ){

                    login();

                }

            }
        );

    }
);


/* =========================================================
   SESSION
========================================================= */

function checkSession(){

    const logged =
        localStorage.getItem(
            "websiteControlLoggedIn"
        );


    const name =
        localStorage.getItem(
            "websiteControlName"
        );


    if(
        logged === "true" &&
        name
    ){

        showDashboard(
            name
        );

    }

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const input =
        document.getElementById(
            "usernameInput"
        );


    const button =
        document.getElementById(
            "loginBtn"
        );


    const error =
        document.getElementById(
            "loginError"
        );


    const username =
        input.value.trim();


    error.style.display =
        "none";


    if(!username){

        showLoginError(
            "Please enter your username."
        );

        input.focus();

        return;

    }


    button.disabled =
        true;


    button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';


    try{

        const url =
            API_URL +
            "?action=login&username=" +
            encodeURIComponent(
                username
            );


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(
            data.success
        ){

            localStorage.setItem(
                "websiteControlLoggedIn",
                "true"
            );


            localStorage.setItem(
                "websiteControlUsername",
                data.username ||
                username
            );


            localStorage.setItem(
                "websiteControlName",
                data.name ||
                username
            );


            showDashboard(
                data.name ||
                username
            );

        }

        else{

            showLoginError(
                data.message ||
                "Username not found."
            );

        }

    }

    catch(error){

        console.error(
            error
        );


        showLoginError(
            "Unable to connect with server."
        );

    }


    button.disabled =
        false;


    button.innerHTML =
        '<i class="fa-solid fa-right-to-bracket"></i>&nbsp; Login';

}


/* =========================================================
   LOGIN ERROR
========================================================= */

function showLoginError(
    message
){

    const error =
        document.getElementById(
            "loginError"
        );


    error.textContent =
        message;


    error.style.display =
        "block";

}


/* =========================================================
   SHOW DASHBOARD
========================================================= */

function showDashboard(
    name
){

    document.getElementById(
        "loginScreen"
    ).style.display =
        "none";


    document.getElementById(
        "dashboard"
    ).style.display =
        "block";


    document.getElementById(
        "loggedUserName"
    ).textContent =
        name;


    loadCards();

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    localStorage.removeItem(
        "websiteControlLoggedIn"
    );


    localStorage.removeItem(
        "websiteControlUsername"
    );


    localStorage.removeItem(
        "websiteControlName"
    );


    cards = [];


    document.getElementById(
        "dashboard"
    ).style.display =
        "none";


    document.getElementById(
        "loginScreen"
    ).style.display =
        "flex";


    document.getElementById(
        "usernameInput"
    ).value =
        "";


    document.getElementById(
        "usernameInput"
    ).focus();

}


/* =========================================================
   LOAD CARDS
========================================================= */

async function loadCards(){

    const loading =
        document.getElementById(
            "loading"
        );


    const cardsBox =
        document.getElementById(
            "cards"
        );


    loading.style.display =
        "block";


    cardsBox.innerHTML =
        "";


    try{

        const response =
            await fetch(
                API_URL +
                "?action=getCards&ts=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(
            !data.success
        ){

            throw new Error(
                data.message ||
                "Failed to load websites."
            );

        }


        cards =
            Array.isArray(
                data.cards
            )
            ? data.cards
            : [];


        renderCards();

    }

    catch(error){

        console.error(
            error
        );


        cardsBox.innerHTML =
            "";


        showToast(
            error.message ||
            "Failed to load websites.",
            "error"
        );

    }


    loading.style.display =
        "none";

}


/* =========================================================
   RENDER CARDS
========================================================= */

function renderCards(){

    const box =
        document.getElementById(
            "cards"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    box.innerHTML =
        "";


    let filtered =
        cards.filter(
            function(card){

                if(
                    String(
                        card.status ||
                        "Active"
                    ).toLowerCase()
                    ===
                    "inactive"
                ){

                    return false;

                }


                if(!search){

                    return true;

                }


                const text = (

                    card.name +
                    " " +
                    card.description +
                    " " +
                    card.source +
                    " " +
                    card.type

                ).toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    if(
        filtered.length === 0
    ){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        function(card){

            box.appendChild(
                createCard(
                    card
                )
            );

        }
    );

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(
    card
){

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "card";


    const logo =
        card.logo
        ? `
            <img
                src="${escapeAttribute(card.logo)}"
                alt=""
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
            >
            <div
                class="logo-fallback"
                style="display:none;"
            >
                ${escapeHTML(
                    getInitials(
                        card.name
                    )
                )}
            </div>
        `
        :
        `
            <div class="logo-fallback">
                ${escapeHTML(
                    getInitials(
                        card.name
                    )
                )}
            </div>
        `;


    article.innerHTML = `

        <div class="card-top">

            <div class="logo">

                ${logo}

            </div>


            <div class="card-title">

                <h3 title="${escapeAttribute(card.name)}">

                    ${escapeHTML(
                        card.name ||
                        "Unnamed Website"
                    )}

                </h3>


                <span>

                    ${escapeHTML(
                        card.type ||
                        "Website"
                    )}

                </span>

            </div>

        </div>


        <div class="card-description">

            ${escapeHTML(
                card.description ||
                "Access website"
            )}

        </div>


        <div class="meta">

            ${
                card.source
                ? `
                    <span>
                        <i class="fa-solid fa-server"></i>
                        ${escapeHTML(card.source)}
                    </span>
                `
                : ""
            }


            ${
                card.type
                ? `
                    <span>
                        <i class="fa-solid fa-tag"></i>
                        ${escapeHTML(card.type)}
                    </span>
                `
                : ""
            }

        </div>


        <div class="card-bottom">

            <a
                class="open-btn"
                href="${escapeAttribute(card.link)}"
                target="_blank"
                rel="noopener noreferrer"
            >

                <i class="fa-solid fa-arrow-up-right-from-square"></i>

                Open

            </a>


            <button
                type="button"
                class="edit-btn"
                title="Edit"
                onclick="openEditModal('${escapeAttribute(card.id)}')"
            >

                <i class="fa-solid fa-pen"></i>

            </button>

        </div>

    `;


    return article;

}


/* =========================================================
   SEARCH
========================================================= */

function filterCards(){

    renderCards();

}


/* =========================================================
   ADD MODAL
========================================================= */

function openAddModal(){

    editingId =
        null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Website";


    document.getElementById(
        "deleteBtn"
    ).style.display =
        "none";


    clearForm();


    document.getElementById(
        "cardModal"
    ).classList.add(
        "show"
    );


    setTimeout(
        function(){

            document.getElementById(
                "formName"
            ).focus();

        },
        100
    );

}


/* =========================================================
   EDIT MODAL
========================================================= */

function openEditModal(
    id
){

    const card =
        cards.find(
            function(item){

                return (
                    String(item.id)
                    ===
                    String(id)
                );

            }
        );


    if(!card){

        showToast(
            "Website not found.",
            "error"
        );

        return;

    }


    editingId =
        card.id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Website";


    document.getElementById(
        "deleteBtn"
    ).style.display =
        "block";


    document.getElementById(
        "formName"
    ).value =
        card.name || "";


    document.getElementById(
        "formLink"
    ).value =
        card.link || "";


    document.getElementById(
        "formLogo"
    ).value =
        card.logo || "";


    document.getElementById(
        "formDescription"
    ).value =
        card.description || "";


    document.getElementById(
        "formSource"
    ).value =
        card.source || "";


    document.getElementById(
        "formType"
    ).value =
        card.type || "";


    document.getElementById(
        "formPosition"
    ).value =
        card.position || "";


    document.getElementById(
        "formStatus"
    ).value =
        card.status || "Active";


    document.getElementById(
        "cardModal"
    ).classList.add(
        "show"
    );

}


/* =========================================================
   CLEAR FORM
========================================================= */

function clearForm(){

    document.getElementById(
        "formName"
    ).value =
        "";


    document.getElementById(
        "formLink"
    ).value =
        "";


    document.getElementById(
        "formLogo"
    ).value =
        "";


    document.getElementById(
        "formDescription"
    ).value =
        "";


    document.getElementById(
        "formSource"
    ).value =
        "";


    document.getElementById(
        "formType"
    ).value =
        "";


    document.getElementById(
        "formPosition"
    ).value =
        "";


    document.getElementById(
        "formStatus"
    ).value =
        "Active";

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document.getElementById(
        "cardModal"
    ).classList.remove(
        "show"
    );


    editingId =
        null;

}


/* =========================================================
   SAVE CARD
========================================================= */

async function saveCard(){

    const name =
        document.getElementById(
            "formName"
        ).value.trim();


    const link =
        document.getElementById(
            "formLink"
        ).value.trim();


    const logo =
        document.getElementById(
            "formLogo"
        ).value.trim();


    const description =
        document.getElementById(
            "formDescription"
        ).value.trim();


    const source =
        document.getElementById(
            "formSource"
        ).value.trim();


    const type =
        document.getElementById(
            "formType"
        ).value.trim();


    const position =
        document.getElementById(
            "formPosition"
        ).value;


    const status =
        document.getElementById(
            "formStatus"
        ).value;


    if(!name){

        showToast(
            "Website name is required.",
            "error"
        );

        return;

    }


    if(!link){

        showToast(
            "Website link is required.",
            "error"
        );

        return;

    }


    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    saveBtn.disabled =
        true;


    saveBtn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';


    const payload = {

        action:
            editingId
            ? "updateCard"
            : "addCard",

        id:
            editingId || "",

        name:
            name,

        link:
            link,

        logo:
            logo,

        description:
            description,

        source:
            source,

        type:
            type,

        position:
            position,

        status:
            status

    };


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const data =
            await response.json();


        if(
            !data.success
        ){

            throw new Error(
                data.message ||
                "Failed to save website."
            );

        }


        closeModal();


        showToast(
            data.message ||
            "Saved successfully.",
            "success"
        );


        await loadCards();

    }

    catch(error){

        console.error(
            error
        );


        showToast(
            error.message ||
            "Failed to save website.",
            "error"
        );

    }


    saveBtn.disabled =
        false;


    saveBtn.innerHTML =
        '<i class="fa-solid fa-check"></i> Save';

}


/* =========================================================
   DELETE CURRENT CARD
========================================================= */

async function deleteCurrentCard(){

    if(!editingId){

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this website?"
        );


    if(!confirmed){

        return;

    }


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "deleteCard",

                            id:
                                editingId

                        })

                }
            );


        const data =
            await response.json();


        if(
            !data.success
        ){

            throw new Error(
                data.message ||
                "Delete failed."
            );

        }


        closeModal();


        showToast(
            data.message ||
            "Website deleted.",
            "success"
        );


        await loadCards();

    }

    catch(error){

        console.error(
            error
        );


        showToast(
            error.message ||
            "Delete failed.",
            "error"
        );

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}


/* =========================================================
   INITIALS
========================================================= */

function getInitials(
    name
){

    const words =
        String(
            name || "W"
        )
        .trim()
        .split(
            /\s+/
        );


    if(
        words.length === 1
    ){

        return words[0]
            .substring(
                0,
                2
            )
            .toUpperCase();

    }


    return (
        words[0][0] +
        words[1][0]
    ).toUpperCase();

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(
    message,
    type
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.className =
        "toast show " +
        (
            type === "error"
            ? "error"
            : "success"
        );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =========================================================
   CLOSE MODAL WHEN CLICK OUTSIDE
========================================================= */

document.getElementById(
    "cardModal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeModal();

        }

    }
);


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);

</script>
